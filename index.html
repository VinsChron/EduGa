<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VinsChron - Months & Weeks Learning</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 3em;
            font-weight: 800;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: #6366f1;
            color: white;
            padding: 5px 15px;
            border-radius: 30px;
            font-size: 0.9em;
            display: inline-block;
            margin-top: 5px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #f0f0f0;
            padding: 5px;
            border-radius: 50px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            transition: all 0.3s;
        }

        .tab.month.active {
            background: #6366f1;
            color: white;
        }

        .tab.week.active {
            background: #ec4899;
            color: white;
        }

        /* Robot */
        .robot-wrapper {
            background: #2c3e50;
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .robot {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
        }

        .head {
            width: 100px;
            height: 80px;
            background: #6366f1;
            border-radius: 40px 40px 20px 20px;
            margin: 0 auto;
            position: relative;
            border: 3px solid #4f46e5;
        }

        .week-robot .head {
            background: #ec4899;
            border-color: #db2777;
        }

        .eyes {
            display: flex;
            justify-content: space-around;
            padding: 15px 20px;
        }

        .eye {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            position: relative;
        }

        .eye::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #2c3e50;
            border-radius: 50%;
            position: absolute;
            top: 5px;
            left: 5px;
        }

        .mouth {
            width: 40px;
            height: 8px;
            background: #4f46e5;
            border-radius: 10px;
            margin: 5px auto 0;
        }

        .week-robot .mouth {
            background: #db2777;
        }

        .body {
            width: 140px;
            height: 90px;
            background: #8b5cf6;
            margin: 0 auto;
            border-radius: 30px;
            position: relative;
            border: 3px solid #7c3aed;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .week-robot .body {
            background: #f472b6;
            border-color: #ec4899;
        }

        .screen {
            width: 100px;
            height: 50px;
            background: #1e272e;
            border-radius: 15px;
            color: #10b981;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            border: 2px solid #2c3e50;
        }

        .arm-left, .arm-right {
            width: 30px;
            height: 80px;
            background: #8b5cf6;
            position: absolute;
            top: 30px;
            border-radius: 20px;
            border: 3px solid #7c3aed;
        }

        .week-robot .arm-left, .week-robot .arm-right {
            background: #f472b6;
            border-color: #ec4899;
        }

        .arm-left { left: 15px; transform: rotate(15deg); }
        .arm-right { right: 15px; transform: rotate(-15deg); }

        .leg-left, .leg-right {
            width: 35px;
            height: 70px;
            background: #8b5cf6;
            position: absolute;
            bottom: -20px;
            border-radius: 20px;
            border: 3px solid #7c3aed;
        }

        .week-robot .leg-left, .week-robot .leg-right {
            background: #f472b6;
            border-color: #ec4899;
        }

        .leg-left { left: 45px; }
        .leg-right { right: 45px; }

        /* Learning Section */
        .learning-section {
            background: rgba(255,255,255,0.8);
            border-radius: 30px;
            padding: 20px;
        }

        .current-item {
            text-align: center;
            font-size: 2.5em;
            font-weight: 800;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        /* Boxes */
        .boxes-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            min-height: 80px;
        }

        .letter-box {
            width: 60px;
            height: 60px;
            background: white;
            border: 3px solid #6366f1;
            border-radius: 15px;
            font-size: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 5px 0 #4f46e5;
            position: relative;
            cursor: pointer;
        }

        .letter-box.filled {
            background: #10b981;
            border-color: #059669;
            color: white;
            box-shadow: 0 5px 0 #059669;
        }

        .delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1em;
            border: 2px solid white;
            cursor: pointer;
        }

        /* Letter Bank */
        .letter-bank {
            background: #f8fafc;
            border-radius: 30px;
            padding: 15px;
            margin: 15px 0;
            border: 2px dashed #6366f1;
        }

        .bank-title {
            text-align: center;
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .letters-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            min-height: 80px;
        }

        .letter-tile {
            width: 60px;
            height: 60px;
            background: #ffe66d;
            border: 3px solid #ffb347;
            border-radius: 15px;
            font-size: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 5px 0 #cc954d;
            cursor: pointer;
            transition: all 0.2s;
        }

        .letter-tile.selected {
            transform: scale(1.1);
            border: 4px solid #6366f1;
            box-shadow: 0 0 20px #6366f1;
        }

        /* Controls */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .control-btn {
            padding: 15px;
            border: none;
            border-radius: 40px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            background: white;
            box-shadow: 0 5px 0 #cbd5e0;
            transition: all 0.1s;
        }

        .control-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #cbd5e0;
        }

        .control-btn.check { background: #10b981; color: white; box-shadow: 0 5px 0 #059669; }
        .control-btn.next { background: #f59e0b; color: white; box-shadow: 0 5px 0 #d97706; }
        .control-btn.clear { background: #ef4444; color: white; box-shadow: 0 5px 0 #dc2626; }
        .control-btn.undo { background: #8b5cf6; color: white; box-shadow: 0 5px 0 #7c3aed; }

        /* Message Box */
        .message-box {
            background: #6366f1;
            border-radius: 40px;
            padding: 15px;
            text-align: center;
            color: white;
            font-size: 1.2em;
            font-weight: 600;
            margin: 10px 0;
        }

        .progress-bar {
            background: rgba(0,0,0,0.1);
            border-radius: 40px;
            padding: 10px;
            text-align: center;
            color: white;
            font-weight: 600;
        }

        /* Mobile Optimizations */
        @media (max-width: 400px) {
            .letter-box, .letter-tile {
                width: 50px;
                height: 50px;
                font-size: 1.8em;
            }
            
            .current-item {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo">VinsChron</div>
            <div class="badge">🌟 Learn with Fun 🌟</div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab month active" id="monthTab" onclick="switchTab('months')">📆 Months (12)</button>
            <button class="tab week" id="weekTab" onclick="switchTab('weeks')">📅 Weeks (7)</button>
        </div>

        <!-- Months Section -->
        <div id="monthsSection">
            <!-- Robot -->
            <div class="robot-wrapper">
                <div class="robot" id="monthRobot">
                    <div class="head"></div>
                    <div class="eyes">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div class="mouth"></div>
                    <div class="body">
                        <div class="screen">
                            <span>MONTHS</span>
                            <span id="monthScreen">0/7</span>
                        </div>
                    </div>
                    <div class="arm-left"></div>
                    <div class="arm-right"></div>
                    <div class="leg-left"></div>
                    <div class="leg-right"></div>
                </div>
            </div>

            <!-- Game Area -->
            <div class="learning-section">
                <div class="current-item" id="monthTitle">JANUARY</div>
                
                <!-- Boxes -->
                <div class="boxes-grid" id="monthBoxes"></div>

                <!-- Letter Bank -->
                <div class="letter-bank">
                    <div class="bank-title">📦 Letters <span id="monthCount">7</span></div>
                    <div class="letters-grid" id="monthBank"></div>
                </div>

                <!-- Controls -->
                <div class="controls-grid">
                    <button class="control-btn check" onclick="checkAnswer('months')">✓ CHECK</button>
                    <button class="control-btn next" onclick="nextItem('months')">→ NEXT</button>
                    <button class="control-btn clear" onclick="clearAll('months')">🗑️ CLEAR</button>
                    <button class="control-btn undo" onclick="undoLast('months')">↩️ UNDO</button>
                </div>

                <!-- Message & Progress -->
                <div class="message-box" id="monthMessage">👆 Pehle letter select karo</div>
                <div class="progress-bar" id="monthProgress">Month 1 of 12</div>
            </div>
        </div>

        <!-- Weeks Section (Hidden) -->
        <div id="weeksSection" style="display: none;">
            <!-- Robot -->
            <div class="robot-wrapper">
                <div class="robot week-robot" id="weekRobot">
                    <div class="head"></div>
                    <div class="eyes">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div class="mouth"></div>
                    <div class="body">
                        <div class="screen">
                            <span>WEEKS</span>
                            <span id="weekScreen">0/6</span>
                        </div>
                    </div>
                    <div class="arm-left"></div>
                    <div class="arm-right"></div>
                    <div class="leg-left"></div>
                    <div class="leg-right"></div>
                </div>
            </div>

            <!-- Game Area -->
            <div class="learning-section">
                <div class="current-item" id="weekTitle">MONDAY</div>
                
                <!-- Boxes -->
                <div class="boxes-grid" id="weekBoxes"></div>

                <!-- Letter Bank -->
                <div class="letter-bank">
                    <div class="bank-title">📦 Letters <span id="weekCount">6</span></div>
                    <div class="letters-grid" id="weekBank"></div>
                </div>

                <!-- Controls -->
                <div class="controls-grid">
                    <button class="control-btn check" onclick="checkAnswer('weeks')">✓ CHECK</button>
                    <button class="control-btn next" onclick="nextItem('weeks')">→ NEXT</button>
                    <button class="control-btn clear" onclick="clearAll('weeks')">🗑️ CLEAR</button>
                    <button class="control-btn undo" onclick="undoLast('weeks')">↩️ UNDO</button>
                </div>

                <!-- Message & Progress -->
                <div class="message-box" id="weekMessage">👆 Pehle letter select karo</div>
                <div class="progress-bar" id="weekProgress">Day 1 of 7</div>
            </div>
        </div>
    </div>

    <script>
        // ==================== DATA ====================
        const months = [
            "JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE",
            "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"
        ];

        const weeks = [
            "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY", "SUNDAY"
        ];

        // ==================== STATE ====================
        let currentTab = 'months';
        let selectedLetter = null;
        
        let monthIndex = 0;
        let weekIndex = 0;
        
        let monthLetters = [];     // Current letters in month bank
        let weekLetters = [];      // Current letters in week bank
        
        let monthBoxes = [];       // Current letters in month boxes
        let weekBoxes = [];        // Current letters in week boxes
        
        let monthLastAction = null;
        let weekLastAction = null;

        // ==================== INIT ====================
        window.onload = function() {
            console.log("VinsChron Starting...");
            loadMonth();
            loadWeek();
        };

        // ==================== MONTHS FUNCTIONS ====================
        function loadMonth() {
            const word = months[monthIndex];
            document.getElementById('monthTitle').innerText = word;
            
            // Create boxes (empty)
            const boxesDiv = document.getElementById('monthBoxes');
            boxesDiv.innerHTML = '';
            monthBoxes = new Array(word.length).fill('');
            
            for(let i = 0; i < word.length; i++) {
                const box = document.createElement('div');
                box.className = 'letter-box';
                box.id = `monthBox${i}`;
                box.setAttribute('data-index', i);
                
                // Delete button
                const del = document.createElement('div');
                del.className = 'delete-btn';
                del.innerText = '✕';
                del.onclick = function(e) {
                    e.stopPropagation();
                    removeFromMonthBox(i);
                };
                box.appendChild(del);
                
                // Click handler
                box.onclick = function(e) {
                    e.stopPropagation();
                    if(e.target.classList.contains('delete-btn')) return;
                    placeInMonthBox(i);
                };
                
                boxesDiv.appendChild(box);
            }
            
            // Create letters (shuffled)
            const letters = word.split('');
            for(let i = letters.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [letters[i], letters[j]] = [letters[j], letters[i]];
            }
            monthLetters = [...letters];
            
            // Display letters in bank
            const bankDiv = document.getElementById('monthBank');
            bankDiv.innerHTML = '';
            letters.forEach((letter, idx) => {
                const tile = document.createElement('div');
                tile.className = 'letter-tile';
                tile.innerText = letter;
                tile.id = `monthLetter${idx}`;
                tile.setAttribute('data-letter', letter);
                
                tile.onclick = function(e) {
                    e.stopPropagation();
                    selectMonthLetter(this);
                };
                
                bankDiv.appendChild(tile);
            });
            
            // Update counts
            document.getElementById('monthCount').innerText = letters.length;
            updateMonthScreen();
            document.getElementById('monthProgress').innerText = `Month ${monthIndex + 1} of 12`;
        }

        function selectMonthLetter(element) {
            // Clear previous selection
            if(selectedLetter) {
                selectedLetter.classList.remove('selected');
            }
            selectedLetter = element;
            element.classList.add('selected');
            document.getElementById('monthMessage').innerText = '✋ Ab box mein tap karo';
        }

        function placeInMonthBox(index) {
            if(!selectedLetter) {
                document.getElementById('monthMessage').innerText = '👆 Pehle letter select karo!';
                return;
            }
            
            const box = document.getElementById(`monthBox${index}`);
            if(box.classList.contains('filled')) {
                document.getElementById('monthMessage').innerText = '❌ Yeh box already bhara hai!';
                return;
            }
            
            const letter = selectedLetter.innerText;
            
            // Save for undo
            monthLastAction = {
                type: 'add',
                index: index,
                letter: letter
            };
            
            // Update box
            box.innerText = letter;
            box.classList.add('filled');
            monthBoxes[index] = letter;
            
            // Remove letter from bank
            selectedLetter.remove();
            
            // Remove from monthLetters array
            const letterIndex = monthLetters.indexOf(letter);
            if(letterIndex > -1) monthLetters.splice(letterIndex, 1);
            
            // Clear selection
            selectedLetter.classList.remove('selected');
            selectedLetter = null;
            
            // Update UI
            document.getElementById('monthCount').innerText = monthLetters.length;
            updateMonthScreen();
            document.getElementById('monthMessage').innerText = '✅ Letter rakh diya!';
            
            // Happy robot effect
            document.getElementById('monthRobot').style.transform = 'scale(1.05)';
            setTimeout(() => {
                document.getElementById('monthRobot').style.transform = 'scale(1)';
            }, 200);
        }

        function removeFromMonthBox(index) {
            const box = document.getElementById(`monthBox${index}`);
            if(!box.classList.contains('filled')) return;
            
            const letter = monthBoxes[index];
            
            // Save for undo
            monthLastAction = {
                type: 'remove',
                index: index,
                letter: letter
            };
            
            // Return letter to bank
            const bankDiv = document.getElementById('monthBank');
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.innerText = letter;
            tile.setAttribute('data-letter', letter);
            tile.onclick = function(e) {
                e.stopPropagation();
                selectMonthLetter(this);
            };
            bankDiv.appendChild(tile);
            
            // Add to monthLetters array
            monthLetters.push(letter);
            
            // Clear box
            box.innerText = '';
            box.classList.remove('filled');
            monthBoxes[index] = '';
            
            // Update UI
            document.getElementById('monthCount').innerText = monthLetters.length;
            updateMonthScreen();
            document.getElementById('monthMessage').innerText = '🗑️ Letter hata diya!';
        }

        // ==================== WEEKS FUNCTIONS ====================
        function loadWeek() {
            const word = weeks[weekIndex];
            document.getElementById('weekTitle').innerText = word;
            
            // Create boxes
            const boxesDiv = document.getElementById('weekBoxes');
            boxesDiv.innerHTML = '';
            weekBoxes = new Array(word.length).fill('');
            
            for(let i = 0; i < word.length; i++) {
                const box = document.createElement('div');
                box.className = 'letter-box';
                box.id = `weekBox${i}`;
                box.setAttribute('data-index', i);
                
                const del = document.createElement('div');
                del.className = 'delete-btn';
                del.innerText = '✕';
                del.onclick = function(e) {
                    e.stopPropagation();
                    removeFromWeekBox(i);
                };
                box.appendChild(del);
                
                box.onclick = function(e) {
                    e.stopPropagation();
                    if(e.target.classList.contains('delete-btn')) return;
                    placeInWeekBox(i);
                };
                
                boxesDiv.appendChild(box);
            }
            
            // Create letters
            const letters = word.split('');
            for(let i = letters.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [letters[i], letters[j]] = [letters[j], letters[i]];
            }
            weekLetters = [...letters];
            
            const bankDiv = document.getElementById('weekBank');
            bankDiv.innerHTML = '';
            letters.forEach((letter, idx) => {
                const tile = document.createElement('div');
                tile.className = 'letter-tile';
                tile.innerText = letter;
                tile.id = `weekLetter${idx}`;
                tile.setAttribute('data-letter', letter);
                
                tile.onclick = function(e) {
                    e.stopPropagation();
                    selectWeekLetter(this);
                };
                
                bankDiv.appendChild(tile);
            });
            
            document.getElementById('weekCount').innerText = letters.length;
            updateWeekScreen();
            document.getElementById('weekProgress').innerText = `Day ${weekIndex + 1} of 7`;
        }

        function selectWeekLetter(element) {
            if(selectedLetter) {
                selectedLetter.classList.remove('selected');
            }
            selectedLetter = element;
            element.classList.add('selected');
            document.getElementById('weekMessage').innerText = '✋ Ab box mein tap karo';
        }

        function placeInWeekBox(index) {
            if(!selectedLetter) {
                document.getElementById('weekMessage').innerText = '👆 Pehle letter select karo!';
                return;
            }
            
            const box = document.getElementById(`weekBox${index}`);
            if(box.classList.contains('filled')) {
                document.getElementById('weekMessage').innerText = '❌ Yeh box already bhara hai!';
                return;
            }
            
            const letter = selectedLetter.innerText;
            
            weekLastAction = {
                type: 'add',
                index: index,
                letter: letter
            };
            
            box.innerText = letter;
            box.classList.add('filled');
            weekBoxes[index] = letter;
            
            selectedLetter.remove();
            
            const letterIndex = weekLetters.indexOf(letter);
            if(letterIndex > -1) weekLetters.splice(letterIndex, 1);
            
            selectedLetter.classList.remove('selected');
            selectedLetter = null;
            
            document.getElementById('weekCount').innerText = weekLetters.length;
            updateWeekScreen();
            document.getElementById('weekMessage').innerText = '✅ Letter rakh diya!';
            
            document.getElementById('weekRobot').style.transform = 'scale(1.05)';
            setTimeout(() => {
                document.getElementById('weekRobot').style.transform = 'scale(1)';
            }, 200);
        }

        function removeFromWeekBox(index) {
            const box = document.getElementById(`weekBox${index}`);
            if(!box.classList.contains('filled')) return;
            
            const letter = weekBoxes[index];
            
            weekLastAction = {
                type: 'remove',
                index: index,
                letter: letter
            };
            
            const bankDiv = document.getElementById('weekBank');
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.innerText = letter;
            tile.setAttribute('data-letter', letter);
            tile.onclick = function(e) {
                e.stopPropagation();
                selectWeekLetter(this);
            };
            bankDiv.appendChild(tile);
            
            weekLetters.push(letter);
            
            box.innerText = '';
            box.classList.remove('filled');
            weekBoxes[index] = '';
            
            document.getElementById('weekCount').innerText = weekLetters.length;
            updateWeekScreen();
            document.getElementById('weekMessage').innerText = '🗑️ Letter hata diya!';
        }

        // ==================== COMMON FUNCTIONS ====================
        function updateMonthScreen() {
            const filled = monthBoxes.filter(l => l !== '').length;
            const total = months[monthIndex].length;
            document.getElementById('monthScreen').innerText = `${filled}/${total}`;
        }

        function updateWeekScreen() {
            const filled = weekBoxes.filter(l => l !== '').length;
            const total = weeks[weekIndex].length;
            document.getElementById('weekScreen').innerText = `${filled}/${total}`;
        }

        function checkAnswer(type) {
            if(type === 'months') {
                const correct = months[monthIndex];
                const userWord = monthBoxes.join('');
                
                if(monthBoxes.includes('')) {
                    document.getElementById('monthMessage').innerText = '📦 Saare boxes bharo!';
                    return;
                }
                
                if(userWord === correct) {
                    document.getElementById('monthMessage').innerText = '🎉 Shabash! Bilkul sahi!';
                    // Celebration effect
                    for(let i = 0; i < 5; i++) {
                        setTimeout(() => {
                            document.getElementById('monthRobot').style.transform = 'scale(1.1)';
                            setTimeout(() => {
                                document.getElementById('monthRobot').style.transform = 'scale(1)';
                            }, 100);
                        }, i * 200);
                    }
                } else {
                    document.getElementById('monthMessage').innerText = '❌ Galat! Dobara try karo!';
                    document.getElementById('monthRobot').style.backgroundColor = '#ef4444';
                    setTimeout(() => {
                        document.getElementById('monthRobot').style.backgroundColor = '';
                    }, 500);
                }
            } else {
                const correct = weeks[weekIndex];
                const userWord = weekBoxes.join('');
                
                if(weekBoxes.includes('')) {
                    document.getElementById('weekMessage').innerText = '📦 Saare boxes bharo!';
                    return;
                }
                
                if(userWord === correct) {
                    document.getElementById('weekMessage').innerText = '🎉 Shabash! Bilkul sahi!';
                    for(let i = 0; i < 5; i++) {
                        setTimeout(() => {
                            document.getElementById('weekRobot').style.transform = 'scale(1.1)';
                            setTimeout(() => {
                                document.getElementById('weekRobot').style.transform = 'scale(1)';
                            }, 100);
                        }, i * 200);
                    }
                } else {
                    document.getElementById('weekMessage').innerText = '❌ Galat! Dobara try karo!';
                    document.getElementById('weekRobot').style.backgroundColor = '#ef4444';
                    setTimeout(() => {
                        document.getElementById('weekRobot').style.backgroundColor = '';
                    }, 500);
                }
            }
        }

        function clearAll(type) {
            if(type === 'months') {
                for(let i = 0; i < monthBoxes.length; i++) {
                    if(monthBoxes[i] !== '') {
                        removeFromMonthBox(i);
                    }
                }
                document.getElementById('monthMessage').innerText = '🧨 Saaf kar diya!';
            } else {
                for(let i = 0; i < weekBoxes.length; i++) {
                    if(weekBoxes[i] !== '') {
                        removeFromWeekBox(i);
                    }
                }
                document.getElementById('weekMessage').innerText = '🧨 Saaf kar diya!';
            }
        }

        function undoLast(type) {
            if(type === 'months') {
                if(monthLastAction) {
                    if(monthLastAction.type === 'add') {
                        removeFromMonthBox(monthLastAction.index);
                    } else {
                        // For remove, we would need to re-add, but keeping simple
                        document.getElementById('monthMessage').innerText = '↩️ Undo kiya!';
                    }
                    monthLastAction = null;
                } else {
                    document.getElementById('monthMessage').innerText = '⚠️ Kuch nahi hai undo karne ko!';
                }
            } else {
                if(weekLastAction) {
                    if(weekLastAction.type === 'add') {
                        removeFromWeekBox(weekLastAction.index);
                    }
                    weekLastAction = null;
                    document.getElementById('weekMessage').innerText = '↩️ Undo kiya!';
                } else {
                    document.getElementById('weekMessage').innerText = '⚠️ Kuch nahi hai undo karne ko!';
                }
            }
        }

        function nextItem(type) {
            if(type === 'months') {
                if(monthIndex < months.length - 1) {
                    // Check if current is complete
                    if(monthBoxes.includes('')) {
                        document.getElementById('monthMessage').innerText = '⚠️ Pehle yeh month khatam karo!';
                        return;
                    }
                    monthIndex++;
                    loadMonth();
                    document.getElementById('monthMessage').innerText = '🚀 Naya month!';
                } else {
                    document.getElementById('monthMessage').innerText = '🏆 Saare months complete!';
                    // Celebration
                    alert('🎉 Wah! Tumne saare months seekh liye! 🎉');
                    monthIndex = 0;
                    loadMonth();
                }
            } else {
                if(weekIndex < weeks.length - 1) {
                    if(weekBoxes.includes('')) {
                        document.getElementById('weekMessage').innerText = '⚠️ Pehle yeh day khatam karo!';
                        return;
                    }
                    weekIndex++;
                    loadWeek();
                    document.getElementById('weekMessage').innerText = '🚀 Naya day!';
                } else {
                    document.getElementById('weekMessage').innerText = '🏆 Saare weeks complete!';
                    alert('🎉 Wah! Tumne saare days seekh liye! 🎉');
                    weekIndex = 0;
                    loadWeek();
                }
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            
            // Update tab buttons
            document.getElementById('monthTab').classList.toggle('active', tab === 'months');
            document.getElementById('weekTab').classList.toggle('active', tab === 'weeks');
            
            // Show/hide sections
            document.getElementById('monthsSection').style.display = tab === 'months' ? 'block' : 'none';
            document.getElementById('weeksSection').style.display = tab === 'weeks' ? 'block' : 'none';
            
            // Clear selection
            if(selectedLetter) {
                selectedLetter.classList.remove('selected');
                selectedLetter = null;
            }
        }
    </script>
</body>
</html>

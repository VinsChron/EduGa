<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VinsChron • learn with fun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f0f4fa 0%, #e6ecf5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* main card */
        .app-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 24px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: containerFloat 4s ease-in-out infinite;
        }

        @keyframes containerFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* header */
        .header {
            margin-bottom: 20px;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            animation: logoGlow 3s infinite;
        }

        @keyframes logoGlow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(37,99,235,0.3)); }
            50% { filter: drop-shadow(0 0 15px rgba(124,58,237,0.5)); }
        }

        .badge {
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
        }

        /* tabs */
        .tabs {
            display: flex;
            gap: 8px;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 40px;
            margin-bottom: 24px;
            animation: slideUp 0.5s ease-out 0.1s both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: #64748b;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .tab.month.active {
            background: #2563eb;
            color: white;
            transform: scale(1.02);
            box-shadow: 0 10px 20px -5px #2563eb80;
        }

        .tab.week.active {
            background: #7c3aed;
            color: white;
            transform: scale(1.02);
            box-shadow: 0 10px 20px -5px #7c3aed80;
        }

        /* robot */
        .robot-wrapper {
            background: #f1f5f9;
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 24px;
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.2s both;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .robot {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto;
            animation: robotFloat 3s ease-in-out infinite;
        }

        @keyframes robotFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(1deg); }
        }

        /* robot head */
        .head {
            width: 90px;
            height: 80px;
            background: white;
            border-radius: 30px 30px 20px 20px;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 8px 0 #e2e8f0;
            border: 2px solid #e2e8f0;
            animation: headBob 2s infinite;
        }

        @keyframes headBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .month-robot .head {
            background: #dbeafe;
            border-color: #2563eb;
        }

        .week-robot .head {
            background: #f3e8ff;
            border-color: #7c3aed;
        }

        .eyes {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 18px 0 8px;
        }

        .eye {
            width: 18px;
            height: 18px;
            background: #1e293b;
            border-radius: 50%;
            animation: blink 3s infinite;
        }

        @keyframes blink {
            0%, 48%, 52%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }

        .mouth {
            width: 30px;
            height: 6px;
            background: #2563eb;
            border-radius: 10px;
            margin: 4px auto 0;
            transition: all 0.3s;
        }

        .week-robot .mouth {
            background: #7c3aed;
        }

        .robot.happy .mouth {
            width: 40px;
            height: 10px;
            background: #10b981;
            border-radius: 0 0 20px 20px;
        }

        /* robot body */
        .body {
            width: 120px;
            height: 70px;
            background: white;
            border-radius: 25px;
            margin: 8px auto 0;
            position: relative;
            box-shadow: 0 8px 0 #e2e8f0;
            border: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bodyPulse 2s infinite;
        }

        @keyframes bodyPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .month-robot .body {
            background: #dbeafe;
            border-color: #2563eb;
        }

        .week-robot .body {
            background: #f3e8ff;
            border-color: #7c3aed;
        }

        .screen {
            background: #1e293b;
            padding: 6px 12px;
            border-radius: 30px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            animation: screenGlow 2s infinite;
        }

        @keyframes screenGlow {
            0%, 100% { box-shadow: 0 0 5px #10b981; }
            50% { box-shadow: 0 0 15px #10b981; }
        }

        /* arms */
        .arm-left, .arm-right {
            width: 30px;
            height: 60px;
            background: white;
            position: absolute;
            top: 40px;
            border-radius: 20px;
            border: 2px solid #e2e8f0;
            box-shadow: 0 6px 0 #e2e8f0;
            animation: wave 3s infinite;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        .month-robot .arm-left, .month-robot .arm-right {
            background: #dbeafe;
            border-color: #2563eb;
        }

        .week-robot .arm-left, .week-robot .arm-right {
            background: #f3e8ff;
            border-color: #7c3aed;
        }

        .arm-left { left: 15px; animation: waveLeft 3s infinite; }
        .arm-right { right: 15px; animation: waveRight 3s infinite; }

        @keyframes waveLeft {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(-20deg); }
        }

        @keyframes waveRight {
            0%, 100% { transform: rotate(10deg); }
            50% { transform: rotate(20deg); }
        }

        /* legs */
        .leg-left, .leg-right {
            width: 32px;
            height: 55px;
            background: white;
            position: absolute;
            bottom: -15px;
            border-radius: 20px;
            border: 2px solid #e2e8f0;
            box-shadow: 0 6px 0 #e2e8f0;
            animation: walk 2s infinite;
        }

        @keyframes walk {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .month-robot .leg-left, .month-robot .leg-right {
            background: #dbeafe;
            border-color: #2563eb;
        }

        .week-robot .leg-left, .week-robot .leg-right {
            background: #f3e8ff;
            border-color: #7c3aed;
        }

        .leg-left { left: 35px; animation-delay: 0.1s; }
        .leg-right { right: 35px; animation-delay: 0.2s; }

        /* learning section */
        .learning-section {
            background: #f8fafc;
            border-radius: 32px;
            padding: 20px;
            animation: fadeIn 0.5s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .current-item {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
            animation: textGlow 2s infinite;
        }

        @keyframes textGlow {
            0%, 100% { text-shadow: 0 0 5px rgba(37,99,235,0.3); }
            50% { text-shadow: 0 0 15px rgba(124,58,237,0.5); }
        }

        /* boxes */
        .boxes-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            perspective: 1000px;
        }

        .letter-box {
            width: 52px;
            height: 52px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f172a;
            position: relative;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            animation: boxAppear 0.5s ease-out;
            animation-fill-mode: both;
        }

        @keyframes boxAppear {
            from { opacity: 0; transform: scale(0.5) rotateY(180deg); }
            to { opacity: 1; transform: scale(1) rotateY(0); }
        }

        .letter-box:nth-child(1) { animation-delay: 0.1s; }
        .letter-box:nth-child(2) { animation-delay: 0.15s; }
        .letter-box:nth-child(3) { animation-delay: 0.2s; }
        .letter-box:nth-child(4) { animation-delay: 0.25s; }
        .letter-box:nth-child(5) { animation-delay: 0.3s; }
        .letter-box:nth-child(6) { animation-delay: 0.35s; }
        .letter-box:nth-child(7) { animation-delay: 0.4s; }

        .letter-box.filled {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
            transform: scale(1.05);
            animation: fillPop 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .week-section .letter-box.filled {
            background: #7c3aed;
            border-color: #7c3aed;
        }

        @keyframes fillPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1.05); }
        }

        .delete-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 22px;
            height: 22px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid white;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s;
        }

        .letter-box.filled:hover .delete-btn,
        .letter-box.filled .delete-btn {
            opacity: 1;
            transform: scale(1);
            animation: deleteAppear 0.2s;
        }

        @keyframes deleteAppear {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        /* letter bank */
        .letter-bank {
            background: white;
            border-radius: 24px;
            padding: 16px;
            margin: 16px 0;
            border: 2px solid #f1f5f9;
            animation: bankAppear 0.5s ease-out 0.5s both;
        }

        @keyframes bankAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bank-title {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .letters-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .letter-tile {
            width: 52px;
            height: 52px;
            background: #f1f5f9;
            border-radius: 16px;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f172a;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            animation: tileFloat 3s infinite;
            animation-delay: calc(var(--i) * 0.1s);
        }

        .letter-tile:nth-child(1) { --i: 1; }
        .letter-tile:nth-child(2) { --i: 2; }
        .letter-tile:nth-child(3) { --i: 3; }
        .letter-tile:nth-child(4) { --i: 4; }
        .letter-tile:nth-child(5) { --i: 5; }
        .letter-tile:nth-child(6) { --i: 6; }
        .letter-tile:nth-child(7) { --i: 7; }

        @keyframes tileFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .letter-tile.selected {
            background: #2563eb;
            color: white;
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 10px 20px -5px #2563eb;
            z-index: 10;
        }

        .week-section .letter-tile.selected {
            background: #7c3aed;
            box-shadow: 0 10px 20px -5px #7c3aed;
        }

        /* controls */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin: 16px 0;
            animation: controlsAppear 0.5s ease-out 0.6s both;
        }

        @keyframes controlsAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .control-btn {
            padding: 14px;
            border: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: white;
            border: 2px solid #f1f5f9;
            color: #0f172a;
            transition: all 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .control-btn.check {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
        }

        .control-btn.next {
            background: #7c3aed;
            border-color: #7c3aed;
            color: white;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* message */
        .message-box {
            background: #f1f5f9;
            border-radius: 40px;
            padding: 14px;
            text-align: center;
            color: #0f172a;
            font-size: 15px;
            font-weight: 500;
            margin: 12px 0;
            animation: messagePulse 2s infinite;
        }

        @keyframes messagePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .progress-bar {
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            animation: progressGlow 2s infinite;
        }

        @keyframes progressGlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* celebration */
        .celebration-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            display: none;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #2563eb;
            animation: confettiFall 3s linear forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* spark effect */
        .spark {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            animation: sparkFly 0.5s ease-out forwards;
        }

        @keyframes sparkFly {
            0% { transform: scale(1) translate(0, 0); opacity: 1; }
            100% { transform: scale(0) translate(var(--tx), var(--ty)); opacity: 0; }
        }

        /* mobile fine-tuning */
        @media (max-width: 380px) {
            .letter-box, .letter-tile {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
            
            .current-item {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo">VinsChron.</div>
            <div class="badge">learn months & week days</div>
        </div>

        <!-- tabs -->
        <div class="tabs">
            <button class="tab month active" id="monthTab" onclick="switchTab('months')">months</button>
            <button class="tab week" id="weekTab" onclick="switchTab('weeks')">week days</button>
        </div>

        <!-- months section -->
        <div id="monthsSection">
            <!-- robot -->
            <div class="robot-wrapper">
                <div class="robot month-robot" id="monthRobot">
                    <div class="head">
                        <div class="eyes">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>
                        <div class="mouth"></div>
                    </div>
                    <div class="body">
                        <div class="screen" id="monthScreen">0/7</div>
                    </div>
                    <div class="arm-left"></div>
                    <div class="arm-right"></div>
                    <div class="leg-left"></div>
                    <div class="leg-right"></div>
                </div>
            </div>

            <!-- game area -->
            <div class="learning-section">
                <div class="current-item" id="monthTitle">JANUARY</div>
                
                <!-- boxes -->
                <div class="boxes-grid" id="monthBoxes"></div>

                <!-- letter bank -->
                <div class="letter-bank">
                    <div class="bank-title">letters available · <span id="monthCount">7</span></div>
                    <div class="letters-grid" id="monthBank"></div>
                </div>

                <!-- controls -->
                <div class="controls-grid">
                    <button class="control-btn check" onclick="checkAnswer('months')">check</button>
                    <button class="control-btn next" onclick="nextItem('months')">next</button>
                    <button class="control-btn" onclick="clearAll('months')">clear</button>
                    <button class="control-btn" onclick="undoLast('months')">undo</button>
                </div>

                <!-- message -->
                <div class="message-box" id="monthMessage">👆 select a letter, then tap box</div>
                <div class="progress-bar" id="monthProgress">month 1 of 12</div>
            </div>
        </div>

        <!-- weeks section (hidden) -->
        <div id="weeksSection" style="display: none;">
            <!-- robot -->
            <div class="robot-wrapper">
                <div class="robot week-robot" id="weekRobot">
                    <div class="head">
                        <div class="eyes">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>
                        <div class="mouth"></div>
                    </div>
                    <div class="body">
                        <div class="screen" id="weekScreen">0/6</div>
                    </div>
                    <div class="arm-left"></div>
                    <div class="arm-right"></div>
                    <div class="leg-left"></div>
                    <div class="leg-right"></div>
                </div>
            </div>

            <!-- game area -->
            <div class="learning-section week-section">
                <div class="current-item" id="weekTitle">MONDAY</div>
                
                <!-- boxes -->
                <div class="boxes-grid" id="weekBoxes"></div>

                <!-- letter bank -->
                <div class="letter-bank">
                    <div class="bank-title">letters available · <span id="weekCount">6</span></div>
                    <div class="letters-grid" id="weekBank"></div>
                </div>

                <!-- controls -->
                <div class="controls-grid">
                    <button class="control-btn check" onclick="checkAnswer('weeks')">check</button>
                    <button class="control-btn next" onclick="nextItem('weeks')">next</button>
                    <button class="control-btn" onclick="clearAll('weeks')">clear</button>
                    <button class="control-btn" onclick="undoLast('weeks')">undo</button>
                </div>

                <!-- message -->
                <div class="message-box" id="weekMessage">👆 select a letter, then tap box</div>
                <div class="progress-bar" id="weekProgress">day 1 of 7</div>
            </div>
        </div>
    </div>

    <div class="celebration-overlay" id="celebration"></div>

    <script>
        // data
        const months = [
            "JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE",
            "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"
        ];

        const weeks = [
            "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY", "SUNDAY"
        ];

        // state
        let currentTab = 'months';
        let selectedLetter = null;
        
        let monthIndex = 0;
        let weekIndex = 0;
        
        let monthLetters = [];
        let weekLetters = [];
        
        let monthBoxes = [];
        let weekBoxes = [];
        
        let monthLastAction = null;
        let weekLastAction = null;

        // init
        window.onload = () => {
            loadMonth();
            loadWeek();
        };

        // spark effect
        function createSparks(x, y, color) {
            for(let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const spark = document.createElement('div');
                    spark.className = 'spark';
                    spark.style.left = x + 'px';
                    spark.style.top = y + 'px';
                    spark.style.background = color;
                    
                    const tx = (Math.random() - 0.5) * 100;
                    const ty = (Math.random() - 0.5) * 100;
                    spark.style.setProperty('--tx', tx + 'px');
                    spark.style.setProperty('--ty', ty + 'px');
                    
                    document.body.appendChild(spark);
                    setTimeout(() => spark.remove(), 500);
                }, i * 30);
            }
        }

        // months functions
        function loadMonth() {
            const word = months[monthIndex];
            document.getElementById('monthTitle').innerText = word;
            
            const boxesDiv = document.getElementById('monthBoxes');
            boxesDiv.innerHTML = '';
            monthBoxes = new Array(word.length).fill('');
            
            for(let i = 0; i < word.length; i++) {
                const box = document.createElement('div');
                box.className = 'letter-box';
                box.id = `monthBox${i}`;
                box.dataset.index = i;
                
                const del = document.createElement('div');
                del.className = 'delete-btn';
                del.innerText = '✕';
                del.onclick = (e) => {
                    e.stopPropagation();
                    removeFromMonthBox(i);
                    createSparks(e.clientX, e.clientY, '#ef4444');
                };
                box.appendChild(del);
                
                box.onclick = (e) => {
                    e.stopPropagation();
                    if(e.target.classList.contains('delete-btn')) return;
                    placeInMonthBox(i);
                };
                
                boxesDiv.appendChild(box);
            }
            
            const letters = word.split('');
            for(let i = letters.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [letters[i], letters[j]] = [letters[j], letters[i]];
            }
            monthLetters = [...letters];
            
            const bankDiv = document.getElementById('monthBank');
            bankDiv.innerHTML = '';
            letters.forEach((letter, idx) => {
                const tile = document.createElement('div');
                tile.className = 'letter-tile';
                tile.innerText = letter;
                tile.dataset.letter = letter;
                tile.onclick = () => selectMonthLetter(tile);
                bankDiv.appendChild(tile);
            });
            
            document.getElementById('monthCount').innerText = letters.length;
            updateMonthScreen();
            document.getElementById('monthProgress').innerText = `month ${monthIndex + 1} of 12`;
        }

        function selectMonthLetter(el) {
            if(selectedLetter) selectedLetter.classList.remove('selected');
            selectedLetter = el;
            el.classList.add('selected');
            document.getElementById('monthMessage').innerText = '👉 now tap on a box';
        }

        function placeInMonthBox(index) {
            if(!selectedLetter) {
                document.getElementById('monthMessage').innerText = '👆 select a letter first';
                return;
            }
            
            const box = document.getElementById(`monthBox${index}`);
            if(box.classList.contains('filled')) {
                document.getElementById('monthMessage').innerText = '❌ this box is filled';
                return;
            }
            
            const letter = selectedLetter.innerText;
            
            monthLastAction = { type: 'add', index, letter };
            
            box.innerText = letter;
            box.classList.add('filled');
            monthBoxes[index] = letter;
            
            // spark effect
            const rect = box.getBoundingClientRect();
            createSparks(rect.left + rect.width/2, rect.top + rect.height/2, '#10b981');
            
            selectedLetter.remove();
            const letterIndex = monthLetters.indexOf(letter);
            if(letterIndex > -1) monthLetters.splice(letterIndex, 1);
            
            selectedLetter.classList.remove('selected');
            selectedLetter = null;
            
            document.getElementById('monthCount').innerText = monthLetters.length;
            updateMonthScreen();
            document.getElementById('monthMessage').innerText = '✅ letter placed';
            
            // happy robot
            document.getElementById('monthRobot').classList.add('happy');
            setTimeout(() => {
                document.getElementById('monthRobot').classList.remove('happy');
            }, 500);
        }

        function removeFromMonthBox(index) {
            const box = document.getElementById(`monthBox${index}`);
            if(!box.classList.contains('filled')) return;
            
            const letter = monthBoxes[index];
            
            monthLastAction = { type: 'remove', index, letter };
            
            const bankDiv = document.getElementById('monthBank');
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.innerText = letter;
            tile.dataset.letter = letter;
            tile.onclick = () => selectMonthLetter(tile);
            bankDiv.appendChild(tile);
            
            monthLetters.push(letter);
            
            box.innerText = '';
            box.classList.remove('filled');
            monthBoxes[index] = '';
            
            document.getElementById('monthCount').innerText = monthLetters.length;
            updateMonthScreen();
            document.getElementById('monthMessage').innerText = '🗑️ letter removed';
        }

        // weeks functions
        function loadWeek() {
            const word = weeks[weekIndex];
            document.getElementById('weekTitle').innerText = word;
            
            const boxesDiv = document.getElementById('weekBoxes');
            boxesDiv.innerHTML = '';
            weekBoxes = new Array(word.length).fill('');
            
            for(let i = 0; i < word.length; i++) {
                const box = document.createElement('div');
                box.className = 'letter-box';
                box.id = `weekBox${i}`;
                box.dataset.index = i;
                
                const del = document.createElement('div');
                del.className = 'delete-btn';
                del.innerText = '✕';
                del.onclick = (e) => {
                    e.stopPropagation();
                    removeFromWeekBox(i);
                    createSparks(e.clientX, e.clientY, '#ef4444');
                };
                box.appendChild(del);
                
                box.onclick = (e) => {
                    e.stopPropagation();
                    if(e.target.classList.contains('delete-btn')) return;
                    placeInWeekBox(i);
                };
                
                boxesDiv.appendChild(box);
            }
            
            const letters = word.split('');
            for(let i = letters.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [letters[i], letters[j]] = [letters[j], letters[i]];
            }
            weekLetters = [...letters];
            
            const bankDiv = document.getElementById('weekBank');
            bankDiv.innerHTML = '';
            letters.forEach((letter, idx) => {
                const tile = document.createElement('div');
                tile.className = 'letter-tile';
                tile.innerText = letter;
                tile.dataset.letter = letter;
                tile.onclick = () => selectWeekLetter(tile);
                bankDiv.appendChild(tile);
            });
            
            document.getElementById('weekCount').innerText = letters.length;
            updateWeekScreen();
            document.getElementById('weekProgress').innerText = `day ${weekIndex + 1} of 7`;
        }

        function selectWeekLetter(el) {
            if(selectedLetter) selectedLetter.classList.remove('selected');
            selectedLetter = el;
            el.classList.add('selected');
            document.getElementById('weekMessage').innerText = '👉 now tap on a box';
        }

        function placeInWeekBox(index) {
            if(!selectedLetter) {
                document.getElementById('weekMessage').innerText = '👆 select a letter first';
                return;
            }
            
            const box = document.getElementById(`weekBox${index}`);
            if(box.classList.contains('filled')) {
                document.getElementById('weekMessage').innerText = '❌ this box is filled';
                return;
            }
            
            const letter = selectedLetter.innerText;
            
            weekLastAction = { type: 'add', index, letter };
            
            box.innerText = letter;
            box.classList.add('filled');
            weekBoxes[index] = letter;
            
            const rect = box.getBoundingClientRect();
            createSparks(rect.left + rect.width/2, rect.top + rect.height/2, '#10b981');
            
            selectedLetter.remove();
            const letterIndex = weekLetters.indexOf(letter);
            if(letterIndex > -1) weekLetters.splice(letterIndex, 1);
            
            selectedLetter.classList.remove('selected');
            selectedLetter = null;
            
            document.getElementById('weekCount').innerText = weekLetters.length;
            updateWeekScreen();
            document.getElementById('weekMessage').innerText = '✅ letter placed';
            
            document.getElementById('weekRobot').classList.add('happy');
            setTimeout(() => {
                document.getElementById('weekRobot').classList.remove('happy');
            }, 500);
        }

        function removeFromWeekBox(index) {
            const box = document.getElementById(`weekBox${index}`);
            if(!box.classList.contains('filled')) return;
            
            const letter = weekBoxes[index];
            
            weekLastAction = { type: 'remove', index, letter };
            
            const bankDiv = document.getElementById('weekBank');
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.innerText = letter;
            tile.dataset.letter = letter;
            tile.onclick = () => selectWeekLetter(tile);
            bankDiv.appendChild(tile);
            
            weekLetters.push(letter);
            
            box.innerText = '';
            box.classList.remove('filled');
            weekBoxes[index] = '';
            
            document.getElementById('weekCount').innerText = weekLetters.length;
            updateWeekScreen();
            document.getElementById('weekMessage').innerText = '🗑️ letter removed';
        }

        // common functions
        function updateMonthScreen() {
            const filled = monthBoxes.filter(l => l !== '').length;
            const total = months[monthIndex].length;
            document.getElementById('monthScreen').innerText = `${filled}/${total}`;
        }

        function updateWeekScreen() {
            const filled = weekBoxes.filter(l => l !== '').length;
            const total = weeks[weekIndex].length;
            document.getElementById('weekScreen').innerText = `${filled}/${total}`;
        }

        function checkAnswer(type) {
            if(type === 'months') {
                const correct = months[monthIndex];
                const userWord = monthBoxes.join('');
                
                if(monthBoxes.includes('')) {
                    document.getElementById('monthMessage').innerText = '📦 fill all boxes';
                    return;
                }
                
                if(userWord === correct) {
                    document.getElementById('monthMessage').innerText = '🎉 correct! well done';
                    
                    for(let i = 0; i < 10; i++) {
                        setTimeout(() => {
                            createSparks(
                                Math.random() * window.innerWidth,
                                Math.random() * window.innerHeight,
                                '#10b981'
                            );
                        }, i * 100);
                    }
                    
                    for(let i = 0; i < 3; i++) {
                        setTimeout(() => {
                            document.getElementById('monthRobot').style.transform = 'scale(1.1)';
                            setTimeout(() => {
                                document.getElementById('monthRobot').style.transform = 'scale(1)';
                            }, 200);
                        }, i * 300);
                    }
                } else {
                    document.getElementById('monthMessage').innerText = '❌ try again';
                    document.getElementById('monthRobot').style.backgroundColor = '#ef4444';
                    setTimeout(() => {
                        document.getElementById('monthRobot').style.backgroundColor = '';
                    }, 500);
                }
            } else {
                const correct = weeks[weekIndex];
                const userWord = weekBoxes.join('');
                
                if(weekBoxes.includes('')) {
                    document.getElementById('weekMessage').innerText = '📦 fill all boxes';
                    return;
                }
                
                if(userWord === correct) {
                    document.getElementById('weekMessage').innerText = '🎉 correct! well done';
                    
                    for(let i = 0; i < 10; i++) {
                        setTimeout(() => {
                            createSparks(
                                Math.random() * window.innerWidth,
                                Math.random() * window.innerHeight,
                                '#10b981'
                            );
                        }, i * 100);
                    }
                    
                    for(let i = 0; i < 3; i++) {
                        setTimeout(() => {
                            document.getElementById('weekRobot').style.transform = 'scale(1.1)';
                            setTimeout(() => {
                                document.getElementById('weekRobot').style.transform = 'scale(1)';
                            }, 200);
                        }, i * 300);
                    }
                } else {
                    document.getElementById('weekMessage').innerText = '❌ try again';
                    document.getElementById('weekRobot').style.backgroundColor = '#ef4444';
                    setTimeout(() => {
                        document.getElementById('weekRobot').style.backgroundColor = '';
                    }, 500);
                }
            }
        }

        function clearAll(type) {
            if(type === 'months') {
                for(let i = 0; i < monthBoxes.length; i++) {
                    if(monthBoxes[i] !== '') removeFromMonthBox(i);
                }
                document.getElementById('monthMessage').innerText = '🧹 cleared';
            } else {
                for(let i = 0; i < weekBoxes.length; i++) {
                    if(weekBoxes[i] !== '') removeFromWeekBox(i);
                }
                document.getElementById('weekMessage').innerText = '🧹 cleared';
            }
        }

        function undoLast(type) {
            if(type === 'months') {
                if(monthLastAction) {
                    if(monthLastAction.type === 'add') {
                        removeFromMonthBox(monthLastAction.index);
                    }
                    monthLastAction = null;
                    document.getElementById('monthMessage').innerText = '↩️ undone';
                } else {
                    document.getElementById('monthMessage').innerText = 'nothing to undo';
                }
            } else {
                if(weekLastAction) {
                    if(weekLastAction.type === 'add') {
                        removeFromWeekBox(weekLastAction.index);
                    }
                    weekLastAction = null;
                    document.getElementById('weekMessage').innerText = '↩️ undone';
                } else {
                    document.getElementById('weekMessage').innerText = 'nothing to undo';
                }
            }
        }

        function nextItem(type) {
            if(type === 'months') {
                if(monthIndex < months.length - 1) {
                    if(monthBoxes.includes('')) {
                        document.getElementById('monthMessage').innerText = '⚠️ complete this month first';
                        return;
                    }
                    monthIndex++;
                    loadMonth();
                    document.getElementById('monthMessage').innerText = '🚀 next month';
                } else {
                    celebrateWin('months');
                }
            } else {
                if(weekIndex < weeks.length - 1) {
                    if(weekBoxes.includes('')) {
                        document.getElementById('weekMessage').innerText = '⚠️ complete this day first';
                        return;
                    }
                    weekIndex++;
                    loadWeek();
                    document.getElementById('weekMessage').innerText = '🚀 next day';
                } else {
                    celebrateWin('weeks');
                }
            }
        }

        function celebrateWin(type) {
            const overlay = document.getElementById('celebration');
            overlay.style.display = 'block';
            
            document.getElementById(type === 'months' ? 'monthMessage' : 'weekMessage').innerText = '🏆 CONGRATULATIONS! 🏆';
            
            for(let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    overlay.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }
            
            setTimeout(() => {
                overlay.style.display = 'none';
                if(confirm('✨ play again?')) {
                    if(type === 'months') {
                        monthIndex = 0;
                        loadMonth();
                    } else {
                        weekIndex = 0;
                        loadWeek();
                    }
                }
            }, 3000);
        }

        function switchTab(tab) {
            currentTab = tab;
            
            document.getElementById('monthTab').classList.toggle('active', tab === 'months');
            document.getElementById('weekTab').classList.toggle('active', tab === 'weeks');
            
            document.getElementById('monthsSection').style.display = tab === 'months' ? 'block' : 'none';
            document.getElementById('weeksSection').style.display = tab === 'weeks' ? 'block' : 'none';
            
            if(selectedLetter) {
                selectedLetter.classList.remove('selected');
                selectedLetter = null;
            }
        }
    </script>
</body>
</html>

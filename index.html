<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VinsChron • learn with fun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #e8ecf5, #d9e0ec);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            position: relative;
        }

        /* main container */
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 700px;
            background: #ffffff;
            border-radius: 40px;
            padding: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            animation: containerFloat 4s ease-in-out infinite;
            z-index: 10;
        }

        @keyframes containerFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding: 4px 0;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-btn {
            width: 40px;
            height: 40px;
            background: #f1f5f9;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #334155;
            transition: all 0.2s;
        }

        .back-btn:active {
            background: #e2e8f0;
            transform: scale(0.9);
        }

        .back-btn.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .logo {
            flex: 1;
            font-size: 24px;
            font-weight: 600;
            color: #1e293b;
            animation: logoGlow 3s infinite;
        }

        @keyframes logoGlow {
            0%, 100% { text-shadow: 0 2px 5px rgba(37,99,235,0.1); }
            50% { text-shadow: 0 4px 10px rgba(37,99,235,0.2); }
        }

        .badge {
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 12px;
            color: #475569;
            font-weight: 500;
        }

        /* screens container */
        .screens-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
            overflow-y: auto;
            padding: 4px;
            scrollbar-width: none;
        }

        .screen::-webkit-scrollbar {
            display: none;
        }

        .screen.hidden {
            transform: translateX(100%);
        }

        .screen.active {
            transform: translateX(0);
        }

        /* dashboard */
        .stats-row {
            display: flex;
            gap: 8px;
            margin: 8px 0 16px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 30px;
            animation: statsAppear 0.5s ease-out;
        }

        @keyframes statsAppear {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .stat-item {
            flex: 1;
            text-align: center;
            animation: statFloat 3s infinite;
            animation-delay: calc(var(--i) * 0.2s);
        }

        .stat-item:nth-child(1) { --i: 1; }
        .stat-item:nth-child(2) { --i: 2; }
        .stat-item:nth-child(3) { --i: 3; }

        @keyframes statFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: #2563eb;
            margin-bottom: 2px;
        }

        .stat-label {
            font-size: 11px;
            color: #64748b;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 4px 0 16px;
        }

        .dashboard-card {
            background: #f8fafc;
            border-radius: 24px;
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #e2e8f0;
            animation: cardAppear 0.5s ease-out;
            animation-fill-mode: both;
            transition: all 0.2s;
        }

        .dashboard-card:nth-child(1) { animation-delay: 0.02s; }
        .dashboard-card:nth-child(2) { animation-delay: 0.04s; }
        .dashboard-card:nth-child(3) { animation-delay: 0.06s; }
        .dashboard-card:nth-child(4) { animation-delay: 0.08s; }
        .dashboard-card:nth-child(5) { animation-delay: 0.10s; }
        .dashboard-card:nth-child(6) { animation-delay: 0.12s; }
        .dashboard-card:nth-child(7) { animation-delay: 0.14s; }
        .dashboard-card:nth-child(8) { animation-delay: 0.16s; }
        .dashboard-card:nth-child(9) { animation-delay: 0.18s; }
        .dashboard-card:nth-child(10) { animation-delay: 0.20s; }
        .dashboard-card:nth-child(11) { animation-delay: 0.22s; }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dashboard-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(0,0,0,0.1);
        }

        .dashboard-card:active {
            transform: scale(0.97);
        }

        .card-emoji {
            font-size: 32px;
            margin-bottom: 6px;
            animation: emojiSpin 4s infinite;
        }

        @keyframes emojiSpin {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
        }

        .card-title {
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            margin-bottom: 2px;
        }

        .card-count {
            font-size: 11px;
            color: #64748b;
        }

        /* robot - soft colors with animations */
        .robot-wrapper {
            background: #f1f5f9;
            border-radius: 30px;
            padding: 15px;
            margin-bottom: 12px;
            animation: robotAppear 0.6s ease-out;
            position: relative;
        }

        @keyframes robotAppear {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .robot {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto;
            animation: robotFloat 3s ease-in-out infinite;
        }

        @keyframes robotFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .head {
            width: 70px;
            height: 55px;
            background: #ffffff;
            border-radius: 30px 30px 15px 15px;
            margin: 0 auto;
            position: relative;
            border: 2px solid #e2e8f0;
            box-shadow: 0 5px 0 #cbd5e1;
            animation: headBob 2s infinite;
        }

        @keyframes headBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }

        .eyes {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px 0 4px;
        }

        .eye {
            width: 12px;
            height: 12px;
            background: #1e293b;
            border-radius: 50%;
            animation: blink 3s infinite;
        }

        @keyframes blink {
            0%, 48%, 52%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }

        .mouth {
            width: 20px;
            height: 4px;
            background: #64748b;
            border-radius: 6px;
            margin: 2px auto 0;
            transition: all 0.3s;
        }

        .robot.happy .mouth {
            width: 30px;
            height: 8px;
            background: #10b981;
            border-radius: 0 0 20px 20px;
        }

        .body {
            width: 90px;
            height: 45px;
            background: #ffffff;
            border-radius: 20px;
            margin: 5px auto 0;
            position: relative;
            border: 2px solid #e2e8f0;
            box-shadow: 0 5px 0 #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bodyPulse 2s infinite;
        }

        @keyframes bodyPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .screen {
            background: #1e293b;
            padding: 4px 8px;
            border-radius: 20px;
            color: #ffffff;
            font-size: 11px;
            font-weight: 500;
            animation: screenGlow 2s infinite;
        }

        @keyframes screenGlow {
            0%, 100% { box-shadow: 0 0 5px #10b981; }
            50% { box-shadow: 0 0 10px #10b981; }
        }

        .arm-left, .arm-right {
            width: 20px;
            height: 40px;
            background: #ffffff;
            position: absolute;
            top: 30px;
            border-radius: 15px;
            border: 2px solid #e2e8f0;
            box-shadow: 0 4px 0 #cbd5e1;
            animation: wave 3s infinite;
        }

        .arm-left { left: 15px; animation: waveLeft 2s infinite; }
        .arm-right { right: 15px; animation: waveRight 2s infinite; }

        @keyframes waveLeft {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(-15deg); }
        }

        @keyframes waveRight {
            0%, 100% { transform: rotate(10deg); }
            50% { transform: rotate(15deg); }
        }

        .leg-left, .leg-right {
            width: 22px;
            height: 35px;
            background: #ffffff;
            position: absolute;
            bottom: -8px;
            border-radius: 15px;
            border: 2px solid #e2e8f0;
            box-shadow: 0 4px 0 #cbd5e1;
            animation: walk 2s infinite;
        }

        @keyframes walk {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }

        .leg-left { left: 30px; animation-delay: 0.1s; }
        .leg-right { right: 30px; animation-delay: 0.2s; }

        /* robot themes - soft colors */
        .robot[data-theme="months"] .head,
        .robot[data-theme="months"] .body,
        .robot[data-theme="months"] .arm-left,
        .robot[data-theme="months"] .arm-right,
        .robot[data-theme="months"] .leg-left,
        .robot[data-theme="months"] .leg-right {
            background: #e6f0ff;
        }

        .robot[data-theme="weeks"] .head,
        .robot[data-theme="weeks"] .body,
        .robot[data-theme="weeks"] .arm-left,
        .robot[data-theme="weeks"] .arm-right,
        .robot[data-theme="weeks"] .leg-left,
        .robot[data-theme="weeks"] .leg-right {
            background: #f0e6ff;
        }

        .robot[data-theme="numbers"] .head,
        .robot[data-theme="numbers"] .body,
        .robot[data-theme="numbers"] .arm-left,
        .robot[data-theme="numbers"] .arm-right,
        .robot[data-theme="numbers"] .leg-left,
        .robot[data-theme="numbers"] .leg-right {
            background: #e0f2e9;
        }

        .robot[data-theme="colors"] .head,
        .robot[data-theme="colors"] .body,
        .robot[data-theme="colors"] .arm-left,
        .robot[data-theme="colors"] .arm-right,
        .robot[data-theme="colors"] .leg-left,
        .robot[data-theme="colors"] .leg-right {
            background: #ffe6e6;
        }

        /* game section */
        .game-section {
            background: #f8fafc;
            border-radius: 28px;
            padding: 16px;
            animation: gameAppear 0.5s ease-out;
        }

        @keyframes gameAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .current-title {
            font-size: 20px;
            font-weight: 600;
            color: #1e293b;
            text-align: center;
            margin-bottom: 12px;
            animation: titleGlow 2s infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 2px 5px rgba(37,99,235,0.1); }
            50% { text-shadow: 0 4px 10px rgba(37,99,235,0.2); }
        }

        .boxes-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-bottom: 12px;
        }

        .letter-box {
            width: 42px;
            height: 42px;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            position: relative;
            box-shadow: 0 4px 0 #cbd5e1;
            animation: boxAppear 0.3s ease-out;
            animation-fill-mode: both;
            transition: all 0.2s;
        }

        @keyframes boxAppear {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        .letter-box:nth-child(1) { animation-delay: 0.05s; }
        .letter-box:nth-child(2) { animation-delay: 0.10s; }
        .letter-box:nth-child(3) { animation-delay: 0.15s; }
        .letter-box:nth-child(4) { animation-delay: 0.20s; }
        .letter-box:nth-child(5) { animation-delay: 0.25s; }
        .letter-box:nth-child(6) { animation-delay: 0.30s; }
        .letter-box:nth-child(7) { animation-delay: 0.35s; }

        .letter-box.filled {
            background: #2563eb;
            border-color: #2563eb;
            color: #ffffff;
            box-shadow: 0 4px 0 #1e40af;
            animation: fillPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes fillPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1.05); }
        }

        .delete-btn {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 18px;
            height: 18px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            border: 2px solid white;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .letter-box.filled:hover .delete-btn {
            opacity: 1;
        }

        .letter-bank {
            background: #ffffff;
            border-radius: 24px;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #e2e8f0;
            animation: bankAppear 0.5s ease-out 0.2s both;
        }

        @keyframes bankAppear {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bank-title {
            font-size: 12px;
            color: #475569;
            margin-bottom: 8px;
        }

        .letters-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .letter-tile {
            width: 42px;
            height: 42px;
            background: #f1f5f9;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
            cursor: pointer;
            box-shadow: 0 4px 0 #cbd5e1;
            animation: tileFloat 3s infinite;
            animation-delay: calc(var(--i) * 0.1s);
            transition: all 0.2s;
        }

        .letter-tile:nth-child(1) { --i: 1; }
        .letter-tile:nth-child(2) { --i: 2; }
        .letter-tile:nth-child(3) { --i: 3; }
        .letter-tile:nth-child(4) { --i: 4; }
        .letter-tile:nth-child(5) { --i: 5; }
        .letter-tile:nth-child(6) { --i: 6; }
        .letter-tile:nth-child(7) { --i: 7; }

        @keyframes tileFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .letter-tile.selected {
            background: #2563eb;
            color: #ffffff;
            transform: scale(1.15);
            box-shadow: 0 6px 12px rgba(37,99,235,0.3);
            animation: selectedPulse 0.5s infinite;
        }

        @keyframes selectedPulse {
            0%, 100% { box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
            50% { box-shadow: 0 4px 20px rgba(37,99,235,0.5); }
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin: 12px 0;
            animation: controlsAppear 0.5s ease-out 0.3s both;
        }

        @keyframes controlsAppear {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            padding: 10px;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #1e293b;
            transition: all 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
            background: #f1f5f9;
        }

        .btn.check {
            background: #2563eb;
            color: white;
            border: none;
            animation: checkPulse 2s infinite;
        }

        @keyframes checkPulse {
            0%, 100% { box-shadow: 0 4px 10px rgba(37,99,235,0.2); }
            50% { box-shadow: 0 4px 20px rgba(37,99,235,0.4); }
        }

        .btn.next {
            background: #7c3aed;
            color: white;
            border: none;
            animation: nextPulse 2s infinite;
        }

        @keyframes nextPulse {
            0%, 100% { box-shadow: 0 4px 10px rgba(124,58,237,0.2); }
            50% { box-shadow: 0 4px 20px rgba(124,58,237,0.4); }
        }

        .message {
            background: #f1f5f9;
            border-radius: 30px;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            color: #1e293b;
            margin: 8px 0;
            animation: messagePulse 2s infinite;
        }

        @keyframes messagePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .progress {
            text-align: center;
            font-size: 11px;
            color: #64748b;
        }

        /* Fireworks and crackers styles */
        .fireworks-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .cracker {
            position: absolute;
            width: 8px;
            height: 20px;
            background: #f59e0b;
            border-radius: 4px;
            animation: crackerBlast 0.8s ease-out forwards;
            transform-origin: center;
            z-index: 10000;
        }

        @keyframes crackerBlast {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
                background: #f59e0b;
            }
            20% {
                transform: scale(1.5) rotate(180deg);
                background: #ef4444;
            }
            40% {
                transform: scale(2) rotate(360deg);
                background: #10b981;
            }
            60% {
                transform: scale(2.5) rotate(540deg);
                background: #3b82f6;
            }
            80% {
                transform: scale(1.5) rotate(720deg);
                background: #8b5cf6;
                opacity: 0.8;
            }
            100% {
                transform: scale(0) rotate(900deg);
                opacity: 0;
            }
        }

        .firework-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: fireworkExplode 1s ease-out forwards;
        }

        @keyframes fireworkExplode {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: scale(0) translate(var(--x), var(--y));
                opacity: 0;
            }
        }

        .rocket {
            position: absolute;
            width: 10px;
            height: 25px;
            background: linear-gradient(45deg, #f59e0b, #ef4444);
            border-radius: 50% 50% 20% 20%;
            animation: rocketLaunch 1s ease-out forwards;
            z-index: 10000;
        }

        @keyframes rocketLaunch {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            25% {
                transform: translateY(-50px) rotate(10deg);
            }
            50% {
                transform: translateY(-100px) rotate(-10deg);
            }
            75% {
                transform: translateY(-150px) rotate(5deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-200px) rotate(0deg);
                opacity: 0;
            }
        }

        .spark {
            position: fixed;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            animation: sparkFly 0.5s ease-out forwards;
        }

        @keyframes sparkFly {
            0% { transform: scale(1) translate(0, 0); opacity: 1; }
            100% { transform: scale(0) translate(var(--tx), var(--ty)); opacity: 0; }
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            animation: confettiFall 3s linear forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- header -->
        <div class="header">
            <button class="back-btn hidden" id="backBtn" onclick="goBack()">←</button>
            <div class="logo">VinsChron</div>
            <div class="badge">learn & play</div>
        </div>

        <!-- screens -->
        <div class="screens-container">
            <!-- dashboard -->
            <div class="screen active" id="dashboardScreen">
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-value" id="totalCompleted">0</div>
                        <div class="stat-label">completed</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalCorrect">0</div>
                        <div class="stat-label">correct</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="starsDisplay">☆☆☆☆☆</div>
                        <div class="stat-label">stars</div>
                    </div>
                </div>

                <div class="dashboard-grid" id="dashboardGrid"></div>
            </div>

            <!-- game -->
            <div class="screen hidden" id="gameScreen">
                <!-- robot -->
                <div class="robot-wrapper">
                    <div class="robot" id="robot" data-theme="months">
                        <div class="head">
                            <div class="eyes">
                                <div class="eye"></div>
                                <div class="eye"></div>
                            </div>
                            <div class="mouth"></div>
                        </div>
                        <div class="body">
                            <div class="screen" id="gameScreenProgress">0/0</div>
                        </div>
                        <div class="arm-left"></div>
                        <div class="arm-right"></div>
                        <div class="leg-left"></div>
                        <div class="leg-right"></div>
                    </div>
                </div>

                <!-- game area -->
                <div class="game-section">
                    <div class="current-title" id="currentTitle">JANUARY</div>
                    
                    <!-- boxes -->
                    <div class="boxes-grid" id="boxesGrid"></div>

                    <!-- letter bank -->
                    <div class="letter-bank">
                        <div class="bank-title">📦 letters <span id="letterCount">0</span></div>
                        <div class="letters-grid" id="letterBank"></div>
                    </div>

                    <!-- controls -->
                    <div class="controls">
                        <button class="btn check" onclick="checkAnswer()">check</button>
                        <button class="btn next" onclick="nextItem()">next</button>
                        <button class="btn" onclick="clearAll()">clear</button>
                        <button class="btn" onclick="undoLast()">undo</button>
                    </div>

                    <!-- message -->
                    <div class="message" id="message">👆 select letter, tap box</div>
                    <div class="progress" id="progress">item 1 of 12</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Fireworks container -->
    <div class="fireworks-container" id="fireworksContainer"></div>

    <script>
        // ==================== ALL CATEGORIES ====================
        const categories = [
            { id: 'months', name: 'Months', emoji: '📆', count: 12 },
            { id: 'weeks', name: 'Week Days', emoji: '📅', count: 7 },
            { id: 'numbers', name: 'Numbers', emoji: '🔢', count: 10 },
            { id: 'colors', name: 'Colors', emoji: '🎨', count: 10 },
            { id: 'fruits', name: 'Fruits', emoji: '🍎', count: 10 },
            { id: 'animals', name: 'Animals', emoji: '🐘', count: 10 },
            { id: 'body', name: 'Body Parts', emoji: '🫀', count: 10 },
            { id: 'family', name: 'Family', emoji: '👪', count: 10 },
            { id: 'school', name: 'School', emoji: '📚', count: 10 },
            { id: 'vehicles', name: 'Vehicles', emoji: '🚗', count: 10 },
            { id: 'shapes', name: 'Shapes', emoji: '⬛', count: 10 }
        ];

        // ==================== CATEGORY DATA ====================
        const categoryData = {
            months: ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"],
            weeks: ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY", "SUNDAY"],
            numbers: ["ONE", "TWO", "THREE", "FOUR", "FIVE", "SIX", "SEVEN", "EIGHT", "NINE", "TEN"],
            colors: ["RED", "BLUE", "GREEN", "YELLOW", "PURPLE", "ORANGE", "PINK", "BROWN", "BLACK", "WHITE"],
            fruits: ["APPLE", "MANGO", "BANANA", "ORANGE", "GRAPES", "CHERRY", "LEMON", "PEACH", "PEAR", "PLUM"],
            animals: ["CAT", "DOG", "LION", "TIGER", "ELEPHANT", "GIRAFFE", "ZEBRA", "MONKEY", "BEAR", "FOX"],
            body: ["HEAD", "HAND", "FOOT", "ARM", "LEG", "EYE", "EAR", "NOSE", "MOUTH", "HAIR"],
            family: ["MOTHER", "FATHER", "SISTER", "BROTHER", "BABY", "GRANDMA", "GRANDPA", "AUNTY", "UNCLE", "COUSIN"],
            school: ["BOOK", "PEN", "PENCIL", "RULER", "BAG", "CHALK", "BOARD", "DESK", "CHAIR", "ERASER"],
            vehicles: ["CAR", "BUS", "BIKE", "TRAIN", "PLANE", "SHIP", "TRUCK", "VAN", "CYCLE", "BOAT"],
            shapes: ["CIRCLE", "SQUARE", "TRIANGLE", "RECTANGLE", "OVAL", "STAR", "HEART", "DIAMOND", "CROSS", "ARROW"]
        };

        // ==================== STATE ====================
        let currentCategory = 'months';
        let currentIndex = 0;
        let currentLetters = [];
        let currentBoxes = [];
        let lastAction = null;
        let selectedLetter = null;
        
        // Progress tracking
        let completedCount = 0;
        let correctCount = 0;
        let stars = 0;

        // ==================== INIT ====================
        window.onload = () => {
            renderDashboard();
            updateStats();
        };

        // ==================== SCREEN NAVIGATION ====================
        function showDashboard() {
            document.getElementById('dashboardScreen').classList.add('active');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('backBtn').classList.add('hidden');
            renderDashboard();
        }

        function showGame(categoryId) {
            currentCategory = categoryId;
            currentIndex = 0;
            
            document.getElementById('dashboardScreen').classList.remove('active');
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.add('active');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('backBtn').classList.remove('hidden');
            
            // Update robot theme
            document.getElementById('robot').setAttribute('data-theme', categoryId);
            
            // Load category
            loadCategory(categoryId);
        }

        function goBack() {
            showDashboard();
        }

        // ==================== DASHBOARD ====================
        function renderDashboard() {
            const grid = document.getElementById('dashboardGrid');
            grid.innerHTML = '';
            
            categories.forEach(cat => {
                const card = document.createElement('div');
                card.className = 'dashboard-card';
                card.onclick = () => showGame(cat.id);
                
                card.innerHTML = `
                    <div class="card-emoji">${cat.emoji}</div>
                    <div class="card-title">${cat.name}</div>
                    <div class="card-count">${cat.count} words</div>
                `;
                
                grid.appendChild(card);
            });
        }

        function updateStats() {
            document.getElementById('totalCompleted').innerText = completedCount;
            document.getElementById('totalCorrect').innerText = correctCount;
            document.getElementById('starsDisplay').innerText = '⭐'.repeat(stars) + '☆'.repeat(5-stars);
        }

        // ==================== GAME FUNCTIONS ====================
        function loadCategory(categoryId) {
            const data = categoryData[categoryId];
            const word = data[currentIndex];
            
            document.getElementById('currentTitle').innerText = word;
            
            // Create boxes
            const boxesDiv = document.getElementById('boxesGrid');
            boxesDiv.innerHTML = '';
            currentBoxes = new Array(word.length).fill('');
            
            for(let i = 0; i < word.length; i++) {
                const box = document.createElement('div');
                box.className = 'letter-box';
                box.id = `box-${i}`;
                box.dataset.index = i;
                
                const del = document.createElement('div');
                del.className = 'delete-btn';
                del.innerText = '✕';
                del.onclick = (e) => {
                    e.stopPropagation();
                    removeFromBox(i);
                    createSparks(e.clientX, e.clientY, '#ef4444');
                };
                box.appendChild(del);
                
                box.onclick = (e) => {
                    e.stopPropagation();
                    if(e.target.classList.contains('delete-btn')) return;
                    placeInBox(i);
                };
                
                boxesDiv.appendChild(box);
            }
            
            // Create letters (shuffled)
            const letters = word.split('');
            for(let i = letters.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [letters[i], letters[j]] = [letters[j], letters[i]];
            }
            currentLetters = [...letters];
            
            // Display letters
            const bankDiv = document.getElementById('letterBank');
            bankDiv.innerHTML = '';
            letters.forEach((letter, idx) => {
                const tile = document.createElement('div');
                tile.className = 'letter-tile';
                tile.innerText = letter;
                tile.dataset.letter = letter;
                tile.onclick = () => selectLetter(tile);
                bankDiv.appendChild(tile);
            });
            
            // Update counts
            document.getElementById('letterCount').innerText = letters.length;
            updateScreen();
            document.getElementById('progress').innerText = `item ${currentIndex + 1} of ${data.length}`;
        }

        function selectLetter(el) {
            if(selectedLetter) selectedLetter.classList.remove('selected');
            selectedLetter = el;
            el.classList.add('selected');
            document.getElementById('message').innerText = '👉 now tap a box';
        }

        function placeInBox(index) {
            if(!selectedLetter) {
                document.getElementById('message').innerText = '👆 select a letter first';
                return;
            }
            
            const box = document.getElementById(`box-${index}`);
            if(box.classList.contains('filled')) {
                document.getElementById('message').innerText = '❌ box is filled';
                return;
            }
            
            const letter = selectedLetter.innerText;
            
            lastAction = { type: 'add', index, letter };
            
            box.innerText = letter;
            box.classList.add('filled');
            currentBoxes[index] = letter;
            
            // Spark effect
            const rect = box.getBoundingClientRect();
            createSparks(rect.left + rect.width/2, rect.top + rect.height/2, '#10b981');
            
            // Remove letter
            selectedLetter.remove();
            const letterIndex = currentLetters.indexOf(letter);
            if(letterIndex > -1) currentLetters.splice(letterIndex, 1);
            
            selectedLetter.classList.remove('selected');
            selectedLetter = null;
            
            document.getElementById('letterCount').innerText = currentLetters.length;
            updateScreen();
            document.getElementById('message').innerText = '✅ letter placed';
            
            // Happy robot
            document.getElementById('robot').classList.add('happy');
            setTimeout(() => {
                document.getElementById('robot').classList.remove('happy');
            }, 500);
        }

        function removeFromBox(index) {
            const box = document.getElementById(`box-${index}`);
            if(!box.classList.contains('filled')) return;
            
            const letter = currentBoxes[index];
            
            lastAction = { type: 'remove', index, letter };
            
            // Return to bank
            const bankDiv = document.getElementById('letterBank');
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.innerText = letter;
            tile.dataset.letter = letter;
            tile.onclick = () => selectLetter(tile);
            bankDiv.appendChild(tile);
            
            currentLetters.push(letter);
            
            box.innerText = '';
            box.classList.remove('filled');
            currentBoxes[index] = '';
            
            document.getElementById('letterCount').innerText = currentLetters.length;
            updateScreen();
            document.getElementById('message').innerText = '🗑️ letter removed';
        }

        // ==================== FIREWORKS FUNCTIONS ====================
        function createFireworks() {
            const container = document.getElementById('fireworksContainer');
            const robotRect = document.getElementById('robot').getBoundingClientRect();
            const centerX = robotRect.left + robotRect.width / 2;
            const centerY = robotRect.top + robotRect.height / 2;
            
            // Create 20 crackers/rockets
            for(let i = 0; i < 20; i++) {
                setTimeout(() => {
                    // Randomly choose between cracker, rocket, or firework particle
                    const type = Math.floor(Math.random() * 3);
                    
                    if(type === 0) {
                        // Cracker
                        const cracker = document.createElement('div');
                        cracker.className = 'cracker';
                        cracker.style.left = (centerX + (Math.random() - 0.5) * 150) + 'px';
                        cracker.style.top = (centerY + (Math.random() - 0.5) * 150) + 'px';
                        cracker.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
                        container.appendChild(cracker);
                        setTimeout(() => cracker.remove(), 800);
                    } else if(type === 1) {
                        // Rocket
                        const rocket = document.createElement('div');
                        rocket.className = 'rocket';
                        rocket.style.left = (centerX + (Math.random() - 0.5) * 100) + 'px';
                        rocket.style.bottom = '0px';
                        rocket.style.background = `linear-gradient(45deg, hsl(${Math.random() * 360}, 80%, 60%), hsl(${Math.random() * 360}, 80%, 60%))`;
                        container.appendChild(rocket);
                        setTimeout(() => rocket.remove(), 1000);
                    } else {
                        // Firework particles (multiple)
                        for(let j = 0; j < 8; j++) {
                            const particle = document.createElement('div');
                            particle.className = 'firework-particle';
                            particle.style.left = (centerX + (Math.random() - 0.5) * 50) + 'px';
                            particle.style.top = (centerY + (Math.random() - 0.5) * 50) + 'px';
                            particle.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
                            
                            const x = (Math.random() - 0.5) * 200;
                            const y = (Math.random() - 0.5) * 200;
                            particle.style.setProperty('--x', x + 'px');
                            particle.style.setProperty('--y', y + 'px');
                            
                            container.appendChild(particle);
                            setTimeout(() => particle.remove(), 1000);
                        }
                    }
                }, i * 50);
            }
            
            // Also create confetti
            for(let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
                    container.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 100);
            }
        }

        function checkAnswer() {
            const data = categoryData[currentCategory];
            const correct = data[currentIndex];
            const userWord = currentBoxes.join('');
            
            if(currentBoxes.includes('')) {
                document.getElementById('message').innerText = '📦 fill all boxes';
                return;
            }
            
            if(userWord === correct) {
                document.getElementById('message').innerText = '🎉 correct! 🎆';
                correctCount++;
                
                // FIREWORKS! 🎇
                createFireworks();
                
                if(correctCount % 5 === 0 && stars < 5) {
                    stars++;
                    showAchievement('⭐ +1 star!');
                }
                
                for(let i = 0; i < 8; i++) {
                    setTimeout(() => {
                        createSparks(
                            Math.random() * window.innerWidth,
                            Math.random() * window.innerHeight,
                            '#10b981'
                        );
                    }, i * 80);
                }
                
                for(let i = 0; i < 3; i++) {
                    setTimeout(() => {
                        document.getElementById('robot').style.transform = 'scale(1.1)';
                        setTimeout(() => {
                            document.getElementById('robot').style.transform = 'scale(1)';
                        }, 150);
                    }, i * 200);
                }
                
                updateStats();
                
            } else {
                document.getElementById('message').innerText = '❌ try again';
            }
        }

        function nextItem() {
            const data = categoryData[currentCategory];
            
            if(currentIndex < data.length - 1) {
                if(currentBoxes.includes('')) {
                    document.getElementById('message').innerText = '⚠️ complete this first';
                    return;
                }
                currentIndex++;
                loadCategory(currentCategory);
                completedCount++;
                updateStats();
                document.getElementById('message').innerText = '🚀 next item';
            } else {
                if(!currentBoxes.includes('')) {
                    completedCount++;
                    updateStats();
                    celebrateWin();
                }
            }
        }

        function clearAll() {
            for(let i = 0; i < currentBoxes.length; i++) {
                if(currentBoxes[i] !== '') removeFromBox(i);
            }
            document.getElementById('message').innerText = '🧹 cleared';
        }

        function undoLast() {
            if(lastAction && lastAction.type === 'add') {
                removeFromBox(lastAction.index);
                lastAction = null;
                document.getElementById('message').innerText = '↩️ undone';
            } else {
                document.getElementById('message').innerText = 'nothing to undo';
            }
        }

        function updateScreen() {
            const filled = currentBoxes.filter(l => l !== '').length;
            const total = categoryData[currentCategory][currentIndex].length;
            document.getElementById('gameScreenProgress').innerText = `${filled}/${total}`;
        }

        // ==================== EFFECTS ====================
        function createSparks(x, y, color) {
            for(let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const spark = document.createElement('div');
                    spark.className = 'spark';
                    spark.style.left = x + 'px';
                    spark.style.top = y + 'px';
                    spark.style.background = color;
                    
                    const tx = (Math.random() - 0.5) * 60;
                    const ty = (Math.random() - 0.5) * 60;
                    spark.style.setProperty('--tx', tx + 'px');
                    spark.style.setProperty('--ty', ty + 'px');
                    
                    document.body.appendChild(spark);
                    setTimeout(() => spark.remove(), 400);
                }, i * 20);
            }
        }

        function showAchievement(text) {
            const popup = document.createElement('div');
            popup.style.position = 'fixed';
            popup.style.top = '20px';
            popup.style.left = '50%';
            popup.style.transform = 'translateX(-50%)';
            popup.style.background = '#7c3aed';
            popup.style.color = 'white';
            popup.style.padding = '8px 16px';
            popup.style.borderRadius = '30px';
            popup.style.fontSize = '13px';
            popup.style.fontWeight = '500';
            popup.style.zIndex = '1001';
            popup.style.boxShadow = '0 4px 10px rgba(0,0,0,0.1)';
            popup.innerText = text;
            document.body.appendChild(popup);
            
            setTimeout(() => popup.remove(), 1500);
        }

        function celebrateWin() {
            const overlay = document.getElementById('fireworksContainer');
            overlay.innerHTML = '';
            
            document.getElementById('message').innerText = '🏆 complete! 🎆';
            
            // Extra fireworks for win
            for(let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight;
                    
                    for(let j = 0; j < 12; j++) {
                        const particle = document.createElement('div');
                        particle.className = 'firework-particle';
                        particle.style.left = x + 'px';
                        particle.style.top = y + 'px';
                        particle.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
                        
                        const tx = (Math.random() - 0.5) * 300;
                        const ty = (Math.random() - 0.5) * 300;
                        particle.style.setProperty('--x', tx + 'px');
                        particle.style.setProperty('--y', ty + 'px');
                        
                        overlay.appendChild(particle);
                        setTimeout(() => particle.remove(), 1000);
                    }
                }, i * 50);
            }
            
            setTimeout(() => {
                overlay.innerHTML = '';
            }, 3000);
        }
    </script>
</body>
</html>

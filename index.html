<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VinsChron Pro | Months & Weeks Learning</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }

        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1f2937;
            --light: #f9fafb;
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        body {
            min-height: 100vh;
            background: var(--gradient-1);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            animation: float 20s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(10%, 10%) scale(1.1); }
            50% { transform: translate(0, 20%) scale(0.9); }
            75% { transform: translate(-10%, 10%) scale(1.05); }
        }

        /* Main Container */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25), 0 0 0 2px rgba(255,255,255,0.5) inset;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            font-size: 3.5em;
            font-weight: 800;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #ffe66d, #ff8a5c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
            animation: logoGlow 3s infinite;
            letter-spacing: 2px;
        }

        @keyframes logoGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(99,102,241,0.3)); }
            50% { filter: drop-shadow(0 0 20px rgba(236,72,153,0.5)); }
        }

        .badge {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.9em;
            font-weight: 600;
            display: inline-block;
            margin-top: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            background: rgba(0,0,0,0.05);
            padding: 8px;
            border-radius: 60px;
        }

        .tab {
            flex: 1;
            padding: 14px 0;
            border: none;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            background: transparent;
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab.active {
            background: white;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            transform: scale(1.02);
        }

        .tab.month.active { color: var(--primary); }
        .tab.week.active { color: var(--accent); }

        /* Robot Container */
        .robot-wrapper {
            background: linear-gradient(145deg, #2c3e50, #34495e);
            border-radius: 40px;
            padding: 24px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 25px rgba(0,0,0,0.1), 0 0 0 2px rgba(255,255,255,0.1) inset;
        }

        .robot-container {
            position: relative;
            width: 100%;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3D Robot */
        .robot {
            position: relative;
            width: 220px;
            height: 220px;
            filter: drop-shadow(0 20px 20px rgba(0,0,0,0.3));
            transition: transform 0.3s;
        }

        .robot:hover {
            transform: scale(1.02);
        }

        /* Robot Head */
        .head {
            position: absolute;
            width: 120px;
            height: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(145deg, var(--primary), #4f46e5);
            border-radius: 60px 60px 30px 30px;
            border: 4px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 0 #3730a3, 0 15px 20px rgba(0,0,0,0.3);
            z-index: 4;
            overflow: hidden;
            transition: all 0.3s;
        }

        .week-robot .head {
            background: linear-gradient(145deg, var(--accent), #db2777);
            box-shadow: 0 10px 0 #9d174d;
        }

        .face {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .eyes {
            display: flex;
            justify-content: space-around;
            padding: 20px 25px;
        }

        .eye {
            width: 25px;
            height: 25px;
            background: white;
            border-radius: 50%;
            position: relative;
            animation: blink 3s infinite;
        }

        @keyframes blink {
            0%, 48%, 52%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.1); }
        }

        .eye::after {
            content: '';
            width: 12px;
            height: 12px;
            background: var(--dark);
            border-radius: 50%;
            position: absolute;
            top: 6px;
            left: 6px;
            animation: movePupil 3s infinite;
        }

        @keyframes movePupil {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(3px, 3px); }
            50% { transform: translate(-3px, -3px); }
            75% { transform: translate(3px, -3px); }
        }

        .mouth {
            width: 50px;
            height: 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            margin: 5px auto 0;
            transition: all 0.3s;
        }

        .robot.happy .mouth {
            width: 60px;
            height: 20px;
            background: var(--success);
            border-radius: 0 0 30px 30px;
        }

        .robot.sad .mouth {
            width: 40px;
            background: var(--danger);
            border-radius: 30px 30px 0 0;
        }

        /* Antenna */
        .antenna {
            position: absolute;
            width: 12px;
            height: 40px;
            background: linear-gradient(90deg, #ffe66d, #ffb347);
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 10px;
            box-shadow: 0 5px 0 #cc954d, 0 0 20px #ffe66d;
            animation: antennaGlow 1.5s infinite;
            z-index: 5;
        }

        @keyframes antennaGlow {
            0%, 100% { box-shadow: 0 0 20px #ffe66d; }
            50% { box-shadow: 0 0 40px #ffe66d, 0 0 60px #ffb347; }
        }

        .antenna-ball {
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, #ffe66d, #ffb347);
            border-radius: 50%;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 30px #ffe66d;
            animation: ballPulse 1s infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2em;
            z-index: 5;
        }

        @keyframes ballPulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.2); }
        }

        /* Body */
        .body {
            position: absolute;
            width: 160px;
            height: 100px;
            background: linear-gradient(145deg, var(--primary), #4f46e5);
            left: 50%;
            transform: translateX(-50%);
            top: 90px;
            border-radius: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            box-shadow: 0 15px 0 #3730a3, 0 20px 25px rgba(0,0,0,0.3);
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .week-robot .body {
            background: linear-gradient(145deg, var(--accent), #db2777);
            box-shadow: 0 15px 0 #9d174d;
        }

        .screen {
            width: 120px;
            height: 60px;
            background: linear-gradient(145deg, #1e272e, #2c3e50);
            border-radius: 20px;
            border: 3px solid #2c3e50;
            box-shadow: inset 0 0 15px rgba(16,185,129,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--success);
            font-weight: bold;
            font-size: 1.1em;
            animation: screenFlicker 3s infinite;
        }

        @keyframes screenFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .screen-title {
            font-size: 0.8em;
            color: rgba(255,255,255,0.7);
        }

        .screen-value {
            font-size: 1.2em;
            color: var(--success);
            text-shadow: 0 0 10px var(--success);
        }

        /* Arms */
        .arm-left, .arm-right {
            position: absolute;
            width: 35px;
            height: 100px;
            background: linear-gradient(145deg, var(--primary), #4f46e5);
            top: 100px;
            border-radius: 30px;
            border: 4px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 0 #3730a3;
            z-index: 2;
            transition: all 0.3s;
        }

        .week-robot .arm-left, .week-robot .arm-right {
            background: linear-gradient(145deg, var(--accent), #db2777);
            box-shadow: 0 10px 0 #9d174d;
        }

        .arm-left {
            left: 25px;
            transform: rotate(15deg);
            transform-origin: top left;
        }

        .arm-right {
            right: 25px;
            transform: rotate(-15deg);
            transform-origin: top right;
        }

        .hand {
            width: 40px;
            height: 40px;
            background: #ffe66d;
            border-radius: 50%;
            position: absolute;
            bottom: -15px;
            left: -3px;
            box-shadow: 0 8px 0 #cc954d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
        }

        /* Legs */
        .leg-left, .leg-right {
            position: absolute;
            width: 45px;
            height: 90px;
            background: linear-gradient(145deg, var(--primary), #4f46e5);
            top: 170px;
            border-radius: 30px;
            border: 4px solid rgba(255,255,255,0.3);
            box-shadow: 0 15px 0 #3730a3;
            z-index: 1;
            transition: all 0.3s;
        }

        .week-robot .leg-left, .week-robot .leg-right {
            background: linear-gradient(145deg, var(--accent), #db2777);
            box-shadow: 0 15px 0 #9d174d;
        }

        .leg-left {
            left: 45px;
        }

        .leg-right {
            right: 45px;
        }

        .foot {
            width: 55px;
            height: 25px;
            background: #95a5a6;
            border-radius: 30px;
            position: absolute;
            bottom: -20px;
            left: -5px;
            box-shadow: 0 8px 0 #7f8c8d;
        }

        /* Shield */
        .shield {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 3px solid var(--success);
            border-radius: 50%;
            filter: blur(5px);
            animation: shieldPulse 1.5s infinite;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .shield.active {
            opacity: 0.8;
        }

        @keyframes shieldPulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        /* Learning Section */
        .learning-section {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1), 0 0 0 2px rgba(255,255,255,0.5) inset;
        }

        .current-item {
            text-align: center;
            font-size: 2.8em;
            font-weight: 800;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.05);
            animation: itemGlow 2s infinite;
        }

        @keyframes itemGlow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(99,102,241,0.3)); }
            50% { filter: drop-shadow(0 0 15px rgba(236,72,153,0.5)); }
        }

        /* Letter Boxes */
        .boxes-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            perspective: 1000px;
            min-height: 100px;
        }

        .letter-box {
            width: 65px;
            height: 65px;
            background: white;
            border-radius: 18px;
            font-size: 2.2em;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark);
            box-shadow: 0 8px 0 #cbd5e0, 0 10px 15px rgba(0,0,0,0.1);
            transform: rotateX(5deg) rotateY(5deg);
            transition: all 0.2s;
            position: relative;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.8);
        }

        .letter-box.filled {
            background: linear-gradient(145deg, var(--success), #059669);
            color: white;
            box-shadow: 0 8px 0 #047857, 0 10px 20px rgba(16,185,129,0.3);
            transform: rotateX(0) rotateY(0) scale(1.05);
        }

        .letter-box:active {
            transform: scale(0.95);
        }

        .delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            background: var(--danger);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1em;
            font-weight: bold;
            border: 2px solid white;
            box-shadow: 0 3px 0 #b91c1c;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 10;
        }

        .delete-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b91c1c;
        }

        /* Letter Bank */
        .letter-bank {
            background: rgba(0,0,0,0.03);
            border-radius: 30px;
            padding: 20px;
            margin: 20px 0;
            border: 2px dashed rgba(99,102,241,0.3);
        }

        .bank-title {
            text-align: center;
            font-size: 1.3em;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .bank-title span {
            background: var(--gradient-1);
            color: white;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8em;
        }

        .letters-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            min-height: 100px;
        }

        .letter-tile {
            width: 65px;
            height: 65px;
            background: linear-gradient(145deg, #ffe66d, #ffb347);
            border-radius: 18px;
            font-size: 2.2em;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark);
            box-shadow: 0 8px 0 #cc954d, 0 10px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid rgba(255,255,255,0.5);
            animation: floatLetter 2s infinite;
        }

        @keyframes floatLetter {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .letter-tile.selected {
            transform: scale(1.15);
            box-shadow: 0 0 0 4px white, 0 0 0 6px var(--primary), 0 10px 0 #cc954d;
            z-index: 20;
        }

        .letter-tile:active {
            transform: scale(0.95);
        }

        /* Controls */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .control-btn {
            padding: 16px;
            border: none;
            border-radius: 40px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            box-shadow: 0 8px 0 #cbd5e0, 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .control-btn:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #cbd5e0;
        }

        .control-btn.check {
            background: linear-gradient(145deg, var(--success), #059669);
            color: white;
            box-shadow: 0 8px 0 #047857;
        }

        .control-btn.next {
            background: linear-gradient(145deg, var(--warning), #d97706);
            color: white;
            box-shadow: 0 8px 0 #b45309;
        }

        .control-btn.clear {
            background: linear-gradient(145deg, var(--danger), #dc2626);
            color: white;
            box-shadow: 0 8px 0 #b91c1c;
        }

        .control-btn.undo {
            background: linear-gradient(145deg, #8b5cf6, #7c3aed);
            color: white;
            box-shadow: 0 8px 0 #6d28d9;
        }

        /* Message Box */
        .message-box {
            background: linear-gradient(145deg, var(--primary), var(--secondary));
            border-radius: 40px;
            padding: 16px;
            text-align: center;
            font-size: 1.3em;
            font-weight: 600;
            color: white;
            margin: 16px 0;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1), 0 0 0 2px rgba(255,255,255,0.3) inset;
            animation: messagePulse 2s infinite;
        }

        @keyframes messagePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .progress-bar {
            background: rgba(255,255,255,0.2);
            border-radius: 40px;
            padding: 12px;
            text-align: center;
            font-size: 1.2em;
            font-weight: 600;
            color: white;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* Spark Effect */
        .spark {
            position: fixed;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            animation: sparkFly 0.6s ease-out forwards;
        }

        @keyframes sparkFly {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: scale(0) translate(var(--tx), var(--ty));
                opacity: 0;
            }
        }

        /* Celebration Overlay */
        .celebration-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10000;
            display: none;
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            animation: confettiFall 3s linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Mobile Optimizations */
        @media (max-width: 400px) {
            .letter-box, .letter-tile {
                width: 55px;
                height: 55px;
                font-size: 1.8em;
            }
            
            .current-item {
                font-size: 2.2em;
            }
            
            .control-btn {
                padding: 12px;
                font-size: 1em;
            }
        }

        @media (hover: none) {
            .delete-btn {
                opacity: 1;
                width: 28px;
                height: 28px;
                top: -10px;
                right: -10px;
            }
        }
    </style>
</head>
<body>
    <div class="animated-bg">
        <div class="bg-circle" style="width: 300px; height: 300px; top: -50px; right: -50px;"></div>
        <div class="bg-circle" style="width: 400px; height: 400px; bottom: -100px; left: -100px;"></div>
        <div class="bg-circle" style="width: 200px; height: 200px; top: 50%; left: 50%;"></div>
    </div>

    <div class="app-container">
        <div class="header">
            <div class="logo">VinsChron</div>
            <div class="badge">🌟 Learn Months & Weeks 🌟</div>
        </div>

        <div class="tabs">
            <button class="tab month active" onclick="switchTab('months')">
                <span>📆</span> Months (12)
            </button>
            <button class="tab week" onclick="switchTab('weeks')">
                <span>📅</span> Weeks (7)
            </button>
        </div>

        <!-- Months Section -->
        <div id="monthsSection">
            <div class="robot-wrapper">
                <div class="robot-container">
                    <div class="robot month-robot" id="monthRobot">
                        <div class="head" id="monthHead">
                            <div class="face">
                                <div class="eyes">
                                    <div class="eye"></div>
                                    <div class="eye"></div>
                                </div>
                                <div class="mouth"></div>
                            </div>
                        </div>
                        <div class="antenna"></div>
                        <div class="antenna-ball">12</div>
                        <div class="body" id="monthBody">
                            <div class="screen">
                                <span class="screen-title">MONTHS</span>
                                <span class="screen-value" id="monthProgress">0/7</span>
                            </div>
                        </div>
                        <div class="arm-left" id="monthLeftArm">
                            <div class="hand">📆</div>
                        </div>
                        <div class="arm-right" id="monthRightArm">
                            <div class="hand">✓</div>
                        </div>
                        <div class="leg-left" id="monthLeftLeg">
                            <div class="foot"></div>
                        </div>
                        <div class="leg-right" id="monthRightLeg">
                            <div class="foot"></div>
                        </div>
                        <div class="shield" id="monthShield"></div>
                    </div>
                </div>
            </div>

            <div class="learning-section">
                <div class="current-item" id="monthTitle">JANUARY</div>
                
                <!-- Letter Boxes -->
                <div class="boxes-grid" id="monthBoxes"></div>

                <!-- Letter Bank -->
                <div class="letter-bank">
                    <div class="bank-title">
                        📦 Magic Letters
                        <span id="monthLettersCount">7</span>
                    </div>
                    <div class="letters-grid" id="monthBank"></div>
                </div>

                <!-- Controls -->
                <div class="controls-grid">
                    <button class="control-btn check" onclick="checkAnswer('months')">
                        <span>✓</span> Check
                    </button>
                    <button class="control-btn next" onclick="nextItem('months')">
                        <span>→</span> Next
                    </button>
                    <button class="control-btn clear" onclick="clearAll('months')">
                        <span>🗑️</span> Clear
                    </button>
                    <button class="control-btn undo" onclick="undoLast('months')">
                        <span>↩️</span> Undo
                    </button>
                </div>

                <!-- Message & Progress -->
                <div class="message-box" id="monthMessage">✨ Tap a letter, then tap a box! ✨</div>
                <div class="progress-bar" id="monthProgressText">Month 1 of 12</div>
            </div>
        </div>

        <!-- Weeks Section (Hidden) -->
        <div id="weeksSection" style="display: none;">
            <div class="robot-wrapper">
                <div class="robot-container">
                    <div class="robot week-robot" id="weekRobot">
                        <div class="head" id="weekHead">
                            <div class="face">
                                <div class="eyes">
                                    <div class="eye"></div>
                                    <div class="eye"></div>
                                </div>
                                <div class="mouth"></div>
                            </div>
                        </div>
                        <div class="antenna"></div>
                        <div class="antenna-ball">7</div>
                        <div class="body" id="weekBody">
                            <div class="screen">
                                <span class="screen-title">WEEKS</span>
                                <span class="screen-value" id="weekProgress">0/6</span>
                            </div>
                        </div>
                        <div class="arm-left" id="weekLeftArm">
                            <div class="hand">📅</div>
                        </div>
                        <div class="arm-right" id="weekRightArm">
                            <div class="hand">✓</div>
                        </div>
                        <div class="leg-left" id="weekLeftLeg">
                            <div class="foot"></div>
                        </div>
                        <div class="leg-right" id="weekRightLeg">
                            <div class="foot"></div>
                        </div>
                        <div class="shield" id="weekShield"></div>
                    </div>
                </div>
            </div>

            <div class="learning-section">
                <div class="current-item" id="weekTitle">MONDAY</div>
                
                <!-- Letter Boxes -->
                <div class="boxes-grid" id="weekBoxes"></div>

                <!-- Letter Bank -->
                <div class="letter-bank">
                    <div class="bank-title">
                        📦 Magic Letters
                        <span id="weekLettersCount">6</span>
                    </div>
                    <div class="letters-grid" id="weekBank"></div>
                </div>

                <!-- Controls -->
                <div class="controls-grid">
                    <button class="control-btn check" onclick="checkAnswer('weeks')">
                        <span>✓</span> Check
                    </button>
                    <button class="control-btn next" onclick="nextItem('weeks')">
                        <span>→</span> Next
                    </button>
                    <button class="control-btn clear" onclick="clearAll('weeks')">
                        <span>🗑️</span> Clear
                    </button>
                    <button class="control-btn undo" onclick="undoLast('weeks')">
                        <span>↩️</span> Undo
                    </button>
                </div>

                <!-- Message & Progress -->
                <div class="message-box" id="weekMessage">✨ Tap a letter, then tap a box! ✨</div>
                <div class="progress-bar" id="weekProgressText">Day 1 of 7</div>
            </div>
        </div>
    </div>

    <div class="celebration-overlay" id="celebration"></div>

    <script>
        // ==================== DATA ====================
        const months = [
            { name: "JANUARY", spelling: "JANUARY" },
            { name: "FEBRUARY", spelling: "FEBRUARY" },
            { name: "MARCH", spelling: "MARCH" },
            { name: "APRIL", spelling: "APRIL" },
            { name: "MAY", spelling: "MAY" },
            { name: "JUNE", spelling: "JUNE" },
            { name: "JULY", spelling: "JULY" },
            { name: "AUGUST", spelling: "AUGUST" },
            { name: "SEPTEMBER", spelling: "SEPTEMBER" },
            { name: "OCTOBER", spelling: "OCTOBER" },
            { name: "NOVEMBER", spelling: "NOVEMBER" },
            { name: "DECEMBER", spelling: "DECEMBER" }
        ];

        const weekDays = [
            { name: "MONDAY", spelling: "MONDAY" },
            { name: "TUESDAY", spelling: "TUESDAY" },
            { name: "WEDNESDAY", spelling: "WEDNESDAY" },
            { name: "THURSDAY", spelling: "THURSDAY" },
            { name: "FRIDAY", spelling: "FRIDAY" },
            { name: "SATURDAY", spelling: "SATURDAY" },
            { name: "SUNDAY", spelling: "SUNDAY" }
        ];

        // ==================== STATE ====================
        let currentTab = 'months';
        let selectedLetter = null;
        
        const monthsState = {
            currentIndex: 0,
            currentLetters: [],
            damageCount: 0,
            damagedParts: [],
            lastAction: null
        };
        
        const weeksState = {
            currentIndex: 0,
            currentLetters: [],
            damageCount: 0,
            damagedParts: [],
            lastAction: null
        };

        const robotParts = ['Head', 'LeftArm', 'RightArm', 'LeftLeg', 'RightLeg'];

        // ==================== INITIALIZATION ====================
        function init() {
            console.log("Initializing VinsChron...");
            
            // Create months boxes and letters
            createMonthsBoxes();
            createMonthsLetters();
            
            // Create weeks boxes and letters  
            createWeeksBoxes();
            createWeeksLetters();
            
            // Update all displays
            updateAllProgress();
            
            // Setup click handlers
            setupClickHandlers();
            
            console.log("Initialization complete!");
        }

        // ==================== CREATE BOXES ====================
        function createMonthsBoxes() {
            const month = months[monthsState.currentIndex];
            const boxesGrid = document.getElementById('monthBoxes');
            boxesGrid.innerHTML = '';
            
            monthsState.currentLetters = new Array(month.spelling.length).fill('');
            
            for(let i = 0; i < month.spelling.length; i++) {
                const box = document.createElement('div');
                box.className = 'letter-box';
                box.id = `monthsBox-${i}`;
                box.dataset.index = i;
                box.dataset.type = 'months';
                
                // Add delete button
                const deleteBtn = document.createElement('div');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = '✕';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeLetter('months', i);
                };
                box.appendChild(deleteBtn);
                
                boxesGrid.appendChild(box);
            }
        }

        function createWeeksBoxes() {
            const week = weekDays[weeksState.currentIndex];
            const boxesGrid = document.getElementById('weekBoxes');
            boxesGrid.innerHTML = '';
            
            weeksState.currentLetters = new Array(week.spelling.length).fill('');
            
            for(let i = 0; i < week.spelling.length; i++) {
                const box = document.createElement('div');
                box.className = 'letter-box';
                box.id = `weeksBox-${i}`;
                box.dataset.index = i;
                box.dataset.type = 'weeks';
                
                // Add delete button
                const deleteBtn = document.createElement('div');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = '✕';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeLetter('weeks', i);
                };
                box.appendChild(deleteBtn);
                
                boxesGrid.appendChild(box);
            }
        }

        // ==================== CREATE LETTERS ====================
        function createMonthsLetters() {
            const month = months[monthsState.currentIndex];
            const letters = month.spelling.split('');
            
            // Shuffle letters
            for(let i = letters.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [letters[i], letters[j]] = [letters[j], letters[i]];
            }
            
            const bank = document.getElementById('monthBank');
            bank.innerHTML = '';
            
            letters.forEach((letter, index) => {
                const tile = document.createElement('div');
                tile.className = 'letter-tile';
                tile.textContent = letter;
                tile.dataset.letter = letter;
                tile.dataset.id = `month-${index}-${Date.now()}`;
                tile.dataset.type = 'months';
                
                bank.appendChild(tile);
            });
            
            updateLettersCount('months', letters.length);
        }

        function createWeeksLetters() {
            const week = weekDays[weeksState.currentIndex];
            const letters = week.spelling.split('');
            
            // Shuffle letters
            for(let i = letters.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [letters[i], letters[j]] = [letters[j], letters[i]];
            }
            
            const bank = document.getElementById('weekBank');
            bank.innerHTML = '';
            
            letters.forEach((letter, index) => {
                const tile = document.createElement('div');
                tile.className = 'letter-tile';
                tile.textContent = letter;
                tile.dataset.letter = letter;
                tile.dataset.id = `week-${index}-${Date.now()}`;
                tile.dataset.type = 'weeks';
                
                bank.appendChild(tile);
            });
            
            updateLettersCount('weeks', letters.length);
        }

        // ==================== SETUP CLICK HANDLERS ====================
        function setupClickHandlers() {
            // Month letters click
            document.querySelectorAll('#monthBank .letter-tile').forEach(letter => {
                letter.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectLetter(letter, 'months');
                });
            });

            // Week letters click
            document.querySelectorAll('#weekBank .letter-tile').forEach(letter => {
                letter.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectLetter(letter, 'weeks');
                });
            });

            // Month boxes click
            document.querySelectorAll('#monthBoxes .letter-box').forEach(box => {
                box.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if(e.target.classList.contains('delete-btn')) return;
                    placeLetter(box, 'months');
                });
            });

            // Week boxes click
            document.querySelectorAll('#weekBoxes .letter-box').forEach(box => {
                box.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if(e.target.classList.contains('delete-btn')) return;
                    placeLetter(box, 'weeks');
                });
            });

            // Clear selection on outside click
            document.addEventListener('click', (e) => {
                if(!e.target.classList.contains('letter-tile')) {
                    clearSelection();
                }
            });
        }

        // ==================== GAME MECHANICS ====================
        function selectLetter(element, type) {
            clearSelection();
            selectedLetter = element;
            selectedLetter.classList.add('selected');
            showMessage(type, '✋ Now tap on an empty box', '#8b5cf6');
            
            // Haptic feedback
            if(window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }

        function clearSelection() {
            if(selectedLetter) {
                selectedLetter.classList.remove('selected');
                selectedLetter = null;
            }
        }

        function placeLetter(box, type) {
            if(!selectedLetter) {
                showMessage(type, '👆 First select a letter!', '#ef4444');
                return;
            }

            // Check if letter belongs to same type
            if(selectedLetter.dataset.type !== type) {
                showMessage(type, '❌ Wrong section!', '#ef4444');
                return;
            }

            if(box.classList.contains('filled')) {
                showMessage(type, '❌ This box is already filled!', '#ef4444');
                return;
            }

            const letter = selectedLetter.textContent;
            const boxIndex = box.dataset.index;
            const state = type === 'months' ? monthsState : weeksState;
            
            // Save for undo
            state.lastAction = {
                type: 'add',
                boxIndex: boxIndex,
                letter: letter
            };
            
            // Update state
            state.currentLetters[boxIndex] = letter;
            
            // Update box
            box.textContent = letter;
            box.classList.add('filled');
            
            // Remove letter from bank
            selectedLetter.remove();
            
            // Create spark effect
            if(event) {
                createSparks(event.clientX, event.clientY, '#10b981');
            }
            
            // Clear selection
            clearSelection();
            
            // Update UI
            updateScreenProgress(type);
            updateLettersCount(type, state.currentLetters.filter(l => l && l !== '').length);
            
            // Happy robot
            makeRobotHappy(type);
        }

        function removeLetter(type, boxIndex) {
            const box = document.getElementById(`${type}Box-${boxIndex}`);
            const state = type === 'months' ? monthsState : weeksState;
            
            if(box && box.classList.contains('filled')) {
                const letter = state.currentLetters[boxIndex];
                
                // Save for undo
                state.lastAction = {
                    type: 'remove',
                    boxIndex: boxIndex,
                    letter: letter
                };
                
                // Return letter to bank
                returnLetterToBank(type, letter);
                
                // Clear box
                box.textContent = '';
                box.classList.remove('filled');
                state.currentLetters[boxIndex] = '';
                
                // Create spark
                if(event) {
                    createSparks(event.clientX, event.clientY, '#ef4444');
                }
                
                // Update UI
                updateScreenProgress(type);
                updateLettersCount(type, state.currentLetters.filter(l => l && l !== '').length);
            }
        }

        function returnLetterToBank(type, letter) {
            const bank = document.getElementById(`${type}Bank`);
            
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.textContent = letter;
            tile.dataset.letter = letter;
            tile.dataset.id = `${type}-${Date.now()}`;
            tile.dataset.type = type;
            
            tile.addEventListener('click', (e) => {
                e.stopPropagation();
                selectLetter(tile, type);
            });
            
            bank.appendChild(tile);
        }

        function checkAnswer(type) {
            const data = type === 'months' ? months : weekDays;
            const state = type === 'months' ? monthsState : weeksState;
            const item = data[state.currentIndex];
            
            const filledCount = state.currentLetters.filter(l => l && l !== '').length;
            
            if(filledCount < item.spelling.length) {
                showMessage(type, '📦 Place all letters first!', '#ef4444');
                shakeRobot(type);
                return;
            }
            
            let correct = true;
            for(let i = 0; i < item.spelling.length; i++) {
                if(state.currentLetters[i] !== item.spelling[i]) {
                    correct = false;
                    const box = document.getElementById(`${type}Box-${i}`);
                    box.style.backgroundColor = '#ef4444';
                    setTimeout(() => box.style.backgroundColor = '', 500);
                }
            }
            
            if(correct) {
                showMessage(type, '🎉 Perfect! Well done! 🎉', '#10b981');
                
                // Celebration sparks
                for(let i = 0; i < 10; i++) {
                    setTimeout(() => {
                        createSparks(
                            Math.random() * window.innerWidth,
                            Math.random() * window.innerHeight,
                            '#10b981'
                        );
                    }, i * 100);
                }
                
                // Heal robot
                if(state.damageCount > 0) {
                    state.damageCount--;
                    state.damagedParts.pop();
                    updateRobotDamage(type);
                } else {
                    // Activate shield
                    const shield = document.getElementById(`${type}Shield`);
                    if(shield) {
                        shield.classList.add('active');
                        setTimeout(() => {
                            shield.classList.remove('active');
                        }, 1000);
                    }
                }
                
                // Happy robot
                makeRobotHappy(type);
                
                // Check if all completed
                if(state.currentIndex === data.length - 1) {
                    celebrateWin(type);
                }
            } else {
                damageRobot(type);
                showMessage(type, '❌ Oops! Try again!', '#ef4444');
            }
        }

        function damageRobot(type) {
            const state = type === 'months' ? monthsState : weeksState;
            const robot = document.getElementById(`${type}Robot`);
            
            if(state.damageCount < robotParts.length) {
                const part = robotParts[state.damageCount];
                state.damagedParts.push(part);
                state.damageCount++;
                
                robot.classList.add('sad');
                setTimeout(() => robot.classList.remove('sad'), 500);
            }
            
            updateRobotDamage(type);
            
            if(state.damageCount >= robotParts.length) {
                robot.style.animation = 'damageFlash 0.5s infinite';
                showMessage(type, '💥 Robot damaged! Try again!', '#ef4444');
                
                setTimeout(() => {
                    robot.style.animation = '';
                    resetCurrentItem(type);
                }, 2000);
            }
        }

        function updateRobotDamage(type) {
            const prefix = type === 'months' ? 'month' : 'week';
            const state = type === 'months' ? monthsState : weeksState;
            
            robotParts.forEach(part => {
                const element = document.getElementById(`${prefix}${part}`);
                if(element) {
                    element.style.transform = '';
                    element.style.filter = '';
                }
            });
            
            state.damagedParts.forEach((part, index) => {
                const element = document.getElementById(`${prefix}${part}`);
                if(element) {
                    if(index % 3 === 0) element.style.transform = 'rotate(15deg)';
                    if(index % 3 === 1) element.style.transform = 'rotate(-15deg)';
                    if(index % 3 === 2) element.style.transform = 'scale(0.9)';
                    element.style.filter = 'drop-shadow(0 0 5px #ef4444)';
                }
            });
        }

        function makeRobotHappy(type) {
            const robot = document.getElementById(`${type}Robot`);
            robot.classList.add('happy');
            setTimeout(() => robot.classList.remove('happy'), 1000);
        }

        function shakeRobot(type) {
            const robot = document.getElementById(`${type}Robot`);
            robot.style.animation = 'damageFlash 0.3s';
            setTimeout(() => robot.style.animation = '', 300);
        }

        function nextItem(type) {
            const data = type === 'months' ? months : weekDays;
            const state = type === 'months' ? monthsState : weeksState;
            
            if(state.currentIndex < data.length - 1) {
                const filledCount = state.currentLetters.filter(l => l && l !== '').length;
                if(filledCount < data[state.currentIndex].spelling.length) {
                    showMessage(type, '⚠️ Complete current first!', '#f59e0b');
                    return;
                }
                
                state.currentIndex++;
                
                // Recreate boxes and letters
                if(type === 'months') {
                    createMonthsBoxes();
                    createMonthsLetters();
                    document.getElementById('monthTitle').textContent = months[state.currentIndex].name;
                } else {
                    createWeeksBoxes();
                    createWeeksLetters();
                    document.getElementById('weekTitle').textContent = weekDays[state.currentIndex].name;
                }
                
                // Reset robot
                state.damageCount = 0;
                state.damagedParts = [];
                updateRobotDamage(type);
                
                updateProgress(type);
                showMessage(type, `🚀 ${data[state.currentIndex].name}!`, '#10b981');
                
                // Reset click handlers
                setupClickHandlers();
            } else {
                celebrateWin(type);
            }
        }

        function clearAll(type) {
            const state = type === 'months' ? monthsState : weeksState;
            const data = type === 'months' ? months : weekDays;
            const item = data[state.currentIndex];
            
            for(let i = 0; i < item.spelling.length; i++) {
                if(state.currentLetters[i] && state.currentLetters[i] !== '') {
                    returnLetterToBank(type, state.currentLetters[i]);
                    
                    const box = document.getElementById(`${type}Box-${i}`);
                    if(box) {
                        box.textContent = '';
                        box.classList.remove('filled');
                    }
                }
            }
            
            state.currentLetters = new Array(item.spelling.length).fill('');
            state.lastAction = { type: 'clear' };
            
            showMessage(type, '🧹 All cleared!', '#f59e0b');
            updateScreenProgress(type);
            updateLettersCount(type, 0);
        }

        function undoLast(type) {
            const state = type === 'months' ? monthsState : weeksState;
            
            if(state.lastAction) {
                if(state.lastAction.type === 'add') {
                    removeLetter(type, state.lastAction.boxIndex);
                } else if(state.lastAction.type === 'remove') {
                    returnLetterToBank(type, state.lastAction.letter);
                }
                state.lastAction = null;
                showMessage(type, '↩️ Undo done!', '#8b5cf6');
            } else {
                showMessage(type, '⚠️ Nothing to undo!', '#f59e0b');
            }
        }

        // ==================== UI UPDATES ====================
        function updateScreenProgress(type) {
            const state = type === 'months' ? monthsState : weeksState;
            const data = type === 'months' ? months : weekDays;
            const item = data[state.currentIndex];
            const filledCount = state.currentLetters.filter(l => l && l !== '').length;
            
            document.getElementById(`${type}Progress`).textContent = `${filledCount}/${item.spelling.length}`;
        }

        function updateLettersCount(type, count) {
            const element = document.getElementById(`${type}LettersCount`);
            if(element) {
                element.textContent = count;
            }
        }

        function updateProgress(type) {
            const data = type === 'months' ? months : weekDays;
            const state = type === 'months' ? monthsState : weeksState;
            const text = type === 'months' ? 
                `Month ${state.currentIndex + 1} of 12` : 
                `Day ${state.currentIndex + 1} of 7`;
            document.getElementById(`${type}ProgressText`).textContent = text;
        }

        function updateAllProgress() {
            updateProgress('months');
            updateProgress('weeks');
            updateScreenProgress('months');
            updateScreenProgress('weeks');
        }

        function resetCurrentItem(type) {
            if(type === 'months') {
                createMonthsBoxes();
                createMonthsLetters();
            } else {
                createWeeksBoxes();
                createWeeksLetters();
            }
            
            const state = type === 'months' ? monthsState : weeksState;
            state.damageCount = 0;
            state.damagedParts = [];
            updateRobotDamage(type);
            
            showMessage(type, '🔄 Try again! You can do it!', '#8b5cf6');
            setupClickHandlers();
        }

        // ==================== EFFECTS ====================
        function createSparks(x, y, color = '#10b981') {
            for(let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const spark = document.createElement('div');
                    spark.className = 'spark';
                    spark.style.left = x + 'px';
                    spark.style.top = y + 'px';
                    spark.style.background = color;
                    
                    const tx = (Math.random() - 0.5) * 100;
                    const ty = (Math.random() - 0.5) * 100;
                    spark.style.setProperty('--tx', tx + 'px');
                    spark.style.setProperty('--ty', ty + 'px');
                    
                    document.body.appendChild(spark);
                    setTimeout(() => spark.remove(), 600);
                }, i * 30);
            }
        }

        function showMessage(type, text, color) {
            const msgBox = document.getElementById(`${type}Message`);
            if(msgBox) {
                msgBox.textContent = text;
                msgBox.style.background = `linear-gradient(145deg, ${color}, ${adjustColor(color, -20)})`;
                
                msgBox.style.transform = 'scale(1.05)';
                setTimeout(() => {
                    msgBox.style.transform = 'scale(1)';
                }, 200);
            }
        }

        function adjustColor(color, percent) {
            return color;
        }

        function celebrateWin(type) {
            const overlay = document.getElementById('celebration');
            overlay.style.display = 'block';
            
            showMessage(type, '🏆 CONGRATULATIONS! YOU DID IT! 🏆', '#f59e0b');
            
            for(let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    overlay.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }
            
            const robot = document.getElementById(`${type}Robot`);
            robot.style.animation = 'float 0.3s infinite';
            
            setTimeout(() => {
                overlay.style.display = 'none';
                robot.style.animation = '';
                
                if(confirm('🎮 Play again?')) {
                    if(type === 'months') {
                        monthsState.currentIndex = 0;
                        createMonthsBoxes();
                        createMonthsLetters();
                        document.getElementById('monthTitle').textContent = months[0].name;
                    } else {
                        weeksState.currentIndex = 0;
                        createWeeksBoxes();
                        createWeeksLetters();
                        document.getElementById('weekTitle').textContent = weekDays[0].name;
                    }
                    updateAllProgress();
                    setupClickHandlers();
                }
            }, 3000);
        }

        // ==================== TAB SWITCHING ====================
        function switchTab(tab) {
            currentTab = tab;
            
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if(tab === 'months') {
                document.querySelector('.tab.month').classList.add('active');
                document.getElementById('monthsSection').style.display = 'block';
                document.getElementById('weeksSection').style.display = 'none';
            } else {
                document.querySelector('.tab.week').classList.add('active');
                document.getElementById('monthsSection').style.display = 'none';
                document.getElementById('weeksSection').style.display = 'block';
            }
            
            clearSelection();
        }

        // ==================== START ====================
        window.onload = function() {
            init();
        };
    </script>
</body>
</html>
